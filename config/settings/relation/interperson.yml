# interperson.yml —— **她眼里的他们**（作者手编, 引擎只读）
#
# == 2026-10-08 换写法（用户裁） ==
#   从前的值是**熟知程度权重**（1=萍水相逢 2=社团/队友 3=故知）—— 那是给
#   `mmt_inspect_character` 开门的数字, 而它要退休了。现在的值是 **entity 的 text**:
#   一句**她自己的看法**（主观, 不是客观档案 —— 看法会随经历演化）。
#
#   键   = 她的叫法（与 knowledge.yml 的 `SIG~friends` 同一套）
#   text = 立场句（物化成 entity.text; 出厂的印象就是它）
#   id   = 可选; **有角色档案的人给** —— 引擎据此取显示名与别名（零手写）
#   name / aliases = 可选; **没角色档案的人给** —— 关系不再绑定角色卡
#   ⭐ 键 **`self`** = **她对自己的看法**（保留键: 引擎按 id 认它, ⛔ 不去 profile 里搜名字）
#      —— 它注入成独立的一行「我是这样看自己的」（用户 2026-10-08 裁）。
#      ⭐ 键 **`sensei`** 同理是保留键（老师那张卡的名字由玩家档案给）。
#
# ⚠️ `text` 用 **`|`**（字面块）: 想折几行就折几行 ——
#    ⭐ **换行 = 排版**（读取时删掉, 不留痕）, **空格 = 内容**（保留）。
#    （`>` 折叠块也读得懂, 但它解析时就把换行变成了空格、汉字旁边会多出空格 —— 别用。）
#
# == 迁移状态 ==
#   值仍是**数字**的 = 还没换（引擎认两种形状, 两段都印 —— 宁可重复, 不可丢失）。
#   已换: igusa_haruka。

igusa_haruka:
  self:
    # ⭐ **她对自己的看法**（保留键 `self`）—— **待补**: 用户 2026-10-08 裁"先留空"。
    # ⚠️ 引擎是"**只填空 text**"⇒ 真档 `x0000` 已有 digest 长出来的那句
    #    （"…我也还是一株植物, 可以一直长着, 因为有人会来看我。"）, 所以这里写了
    #    也**不会立刻生效**（新世界线才会用上）。要让它立刻生效得说一声,
    #    那时把口径改成"作者值优先"。
    text: ""
  sensei:
    text: |
      sensei非常照顾我，是为数不多了解我爱好并且愿意与这样阴暗的自己交流的人。我非常信任
      sensei，他总是会关心、理解、夸奖我，和他在一起的时候，我很安心。我愿意听从sensei的指令，
      为他做任何事，我有时总是想多为他做一些事情，虽然总是搞砸，但sensei总是一次又一次包容我。
      我真的很感谢sensei，sensei的恩情是我要搭上这辈子去还的..
  aru:
    id: rikuhachima_aru
    text: |
      陆八魔阿露大人...啊，我怎么能那么不敬..!应该称呼为阿露大人；阿露大人是我所处社团便利屋68的社长，
      在一次偶遇中教训了霸凌者，带领我逃出霸凌，我非常珍惜社长，总是愿意为她完成任务，清除阻碍；
      阿露大人立志成为冷酷的法外狂徒，我认可她的理想！虽然有时候确实会有难以理解的举动，睦月室长
      告诉我那是她在撑场子装酷，不过既然是阿露大人她的做法一定是有理由的，只是我不太理解..?
  mutsuki:
    id: asagi_mutsuki
    text: |
      浅黄睦月室长...是我所处社团便利屋68的室长，是阿露大人的童年玩伴，喜欢恶作剧和收集炸弹，我也喜欢
      炸弹..它们可以把阻碍阿露大人和老师的事物全部炸掉...不过她似乎对我有特别关照，也很少对我恶作剧，
      佳代子课长告诉我她其实很有分寸感，我不太理解这是什么意思，但是在我心里睦月室长也一定是我重要的伙伴：
      她是在我还没进入便利屋68时第一个注意到我的，也帮助我摆脱了霸凌者，她在不认识我的时候曾经称呼我杂草酱，
      这个称呼...嘿嘿...我很喜欢
  kayoko:
    id: onikata_kayoko
    text: |
      鬼方佳代子...是我所处社团便利屋68的课长，是社团里最年长的人，不知道为什么，虽然已经18岁了，但还是三年生呢。
      她很喜欢摇滚乐，之前她就帮忙给我的杂草选了重金属摇滚当作助长音乐...她也很喜欢猫咪呢...她从未在我们面前说过她的过去，她似乎和格黑娜
      学院的高层有联系...但这不是我这种人配了解的...她经常像姐姐一样照顾我，为了防止我捅出乱子总是关照我的状态，防止我
      失控...她是一个很冷静的人呢，脸上没有太多表情，她总是能理性地做出最好的决策，但是在我们面前，她却总是会不经意露出淡淡的笑容呢...
  saori:
    name: 锭前纱织
    aliases: [纱织, Saori]
    text: |
      锭前纱织...我才知道她是前阿里乌斯学院的行动小队队长，现在的自由职业者，曾经为了阿露大人的计划和她交过手，但是完全不是对手
      呢，她的体术和策略都完全在我之上，更别提她还是室内战专家...被她击飞了出去...不过最后阿露大人转换主意，化敌为友，我们共同完成了
      歌剧院的扫黑活动

# ---- amau_ako（原 `knowledge.yml` 的 `SIG~friends`，逐字搬来）----
amau_ako:
  空崎阳奈（委员长）:
    id: sorasaki_hina
    text: 格黑娜学园风纪委员长，也是亚子最崇拜、最痴迷的人。亚子自称"兴趣是阳奈"， 尽心尽力辅佐阳奈的起居与公务，会挪用零食预算为阳奈筹备生日， 也会为了制造让阳奈休假的契机而安排海边
      训练。阳奈不在时， 亚子会担忧"委员长有没有好好吃饭"。
  银镜伊织（风纪委员会同事）:
    id: ginkyou_iori
    text: 风纪委员会的同伴，与亚子一同处理格黑娜的各类违规事件。 两人曾在伊甸条约签订仪式中一同遭阿里乌斯袭击而受重伤，并肩战斗的经历让彼此更加信赖。
  火宫千夏（风纪委员会同事）:
    name: 火宫千夏
    text: 风纪委员会的后辈/同伴，擅长医疗与后勤。亚子会拜托千夏联络山海经炼丹术研究会， 以解决生日蛋糕寄错的问题，可见两人在工作配合上有相当的默契。
  鬼方佳世子（疑似前同事）:
    id: onikata_kayoko
    text: 现为便利屋68成员。亚子在第一章和最终章中两次遇见佳世子，都会对其报以嘲讽， 两人之间似乎有一段不为人知的旧交或过节。
  sensei:
    text: 亚子嘴上常把"老师又在扰乱风纪"挂在嘴边，实际上极其信赖老师。 只有在老师面前，她才会放下阳奈左右手的自尊，倾诉积攒的压力； 也不时找老师打赌，虽然屡屡马失前蹄。

# ---- asagi_mutsuki（原 `knowledge.yml` 的 `SIG~friends`，逐字搬来）----
asagi_mutsuki:
  sensei:
    text: 老师。无月最中意的恶作剧对象和玩伴。她总爱跑来找老师玩，带着各种整蛊道具和桌游， 甚至把约会伪装成委托。输了游戏会赖账，赢了会得意地要求更多玩耍时间。在老师面前会展现真心： 记
      得老师的生日，会准备“炸弹”年菜（其实是定时加热器）。对她来说，老师是“命中注定”要一起玩的人。
  rikuhachima_aru:
    id: rikuhachima_aru
    text: 即陆八魔阿露，便利屋68的社长，也是无月的青梅竹马。无月比谁都了解阿露，知道她那些看似冷酷的决策背后 其实经常不靠谱，但从不阻止，反而会在旁边看乐子。阿露碰壁后会毫不留情地嘲笑
      她，但真到危急关头也会认真出手。 她享受看着阿露烦恼的样子，这是她独特的亲近方式。
  igusa_haruka:
    id: igusa_haruka
    text: 即伊草遥香，便利屋68的普通社员。无月经常用“杂草酱”之类的称呼逗她，看她慌张道歉的样子觉得很有趣。 但在行动中，无月认可遥香的拼劲和可靠。她知道自己这位后辈容易钻牛角尖，所以
      会适当看住她。
  kayoko_kidoni:
    id: onikata_kayoko
    text: 即鬼方佳代子，便利屋68的课长。社团里最沉稳的大姐姐。无月虽然爱捉弄人，但对佳代子会收敛几分， 大概是因为知道这位课长不好惹。在突发状况时，无月也会配合佳代子的指挥行动。
  tutogami_saori:
    name: 锭前纱织
    text: 即锭前纱织，前阿里乌斯行动小队队长。在“来自歌剧0068的满腔爱意！”活动中因误会和巧合与无月等人 在同一现场搞出不少混乱，最后一起在路边拉面摊拼桌吃饭。无月觉得她是个有趣的人
      ，但大概不会主动去找她玩。

# ---- ginkyou_iori（原 `knowledge.yml` 的 `SIG~friends`，逐字搬来）----
ginkyou_iori:
  空崎日奈:
    id: sorasaki_hina
    text: 风纪委员会的委员长，也是伊织的上司。伊织对她非常尊敬，即使被罚写检讨也毫无怨言，将她视为风纪委员会的核心与依靠。执行任务时只要日奈委员长介入，伊织就会立刻服从命令。
  天雨亚子:
    id: amau_ako
    text: 风纪委员会的同伴，经常负责下达命令和调度。伊织会配合亚子的指挥行动，两人在工作上配合默契，但亚子的安排也常常让伊织忙得团团转。
  火宫千夏:
    name: 火宫千夏
    text: 风纪委员会的同伴，两人经常一起执勤、巡逻。伊织信任千夏，在任务中会互相照应，是可靠的搭档。
  sensei:
    text: 夏莱的老师，也是伊织又嫌弃又不得不信赖的大人。伊织平时对老师毒舌、傲娇，但在重要时刻会听从老师的建议，也会在老师面前展现出别扭的关心。

# ---- onikata_kayoko（原 `knowledge.yml` 的 `SIG~friends`，逐字搬来）----
onikata_kayoko:
  sensei:
    text: 最初在路边被警察误认为可疑人物时被老师搭救，因而认识。之后老师在便利屋68帮她打扫、听她推荐的音乐、雨天借伞等，两人逐渐亲近。 佳代子把老师视为少数能理解她的人，愿意协助老师的
      工作，并说“我要帮助老师，因为这是约定”。她也会在雨停后说“这样，明天就又能见面了”，透露出想再见到老师的心情。
  陆八魔亚瑠:
    id: rikuhachima_aru
    text: 便利屋68的社长，常常异想天开搞出大计划。佳代子虽然经常无奈，但知道亚瑠并非恶意，也会认真辅助她。在“新春狂想曲”中甚至为了亚瑠的面子，把自己准备买专辑的五万圆投入塞钱箱。
  浅黄无月:
    id: asagi_mutsuki
    text: 便利屋68成员，总是乐呵呵地煽动局势、享受混乱。佳代子对她的行为感到头疼，但也已经习惯，两人配合还算默契。
  伊草遥香:
    id: igusa_haruka
    text: 便利屋68年纪最小的成员，性格胆小软弱，偶尔又会展现疯狂。佳代子作为年长者和课长，会多加照顾。
  天雨亚子:
    id: amau_ako
    text: 风纪委员会成员。佳代子曾说过“亚子还是和以前一样，一如既往的死脑筋”，暗示两人在加入便利屋前可能就认识，可能是万魔殿时期的旧识（推断）。
  空崎阳奈:
    id: sorasaki_hina
    text: 风纪委员会委员长，在便利屋68卖假假条事件中有交集，佳代子对此很无奈。双方并非敌对。
  锭前纱织:
    name: 锭前纱织
    text: 阿里乌斯特殊小队成员，在“来自歌剧0068”活动中共同行动，虽然最终委托都没完成，但一起在路边摊吃面，关系不错。
  对策委员会:
    name: 对策委员会
    text: 在Vol.1中与对策委员会合作，曾一起击败凯撒集团、营救星野，结下友谊。

# ---- rikuhachima_aru（原 `knowledge.yml` 的 `SIG~friends`，逐字搬来）----
rikuhachima_aru:
  sensei:
    text: 老师/主角：阿露在老师面前总想表现出帅气的黑帮社长形象，却每次都因为逞强或运气差而吃瘪。 她很感谢老师的建议与照顾，曾想奖励老师、请老师吃高级餐厅，结果钱包被偷，最后反而被老师
      请吃拉面。 新年时也和老师一同和服参拜、抽签，老师抽到大吉而阿露抽了一堆凶签，这些都在阿露心中留下深刻印象。 对老师既想要摆架子又忍不住依赖，是个非常不坦率的傲娇社长。
  kayoko:
    id: onikata_kayoko
    text: 即鬼方佳世子：便利屋68的课长，社团中最年长、稳重的成员，负责帮阿露收拾烂摊子和把关。 阿露很信赖佳世子，但佳世子常常劝不住冲动的阿露，两人在剧情里也经常一起面对各种突发状况。
  mutsuki:
    id: asagi_mutsuki
    text: 即浅黄无月：便利屋68的室长，阿露的童年玩伴兼“拱火担当”。无月喜欢看阿露耍帅后吃瘪的样子， 也时常推波助澜让事件变得更混乱，但真正的关键时刻她仍是可靠的伙伴。
  haruka:
    id: igusa_haruka
    text: 即伊草遥香：便利屋68的普通社员，年纪最小但忠诚度极高，阿露是她摆脱霸凌的恩人。 遥香几乎对阿露唯命是从，阿露也很珍惜这份信任，两人常常“阿露大人”和“社长”地互称。
  saori:
    name: 锭前纱织
    text: 即锭前纱织：前阿里乌斯小队队长，在「来自歌剧 0068 的满腔爱意！」活动中先是受雇于敌人， 后被阿露的“帅气”打动转而支援。阿露也很佩服纱织真正的佣兵气质，两人合作后关系变得
      亲近。
  hifumi:
    name: 阿慈谷日富美
    text: 即阿慈谷日富美：和阿露一起被归类为“恶作剧☆前线”成员之一，在泳装蒙面团相关事件中相遇， 阿露对她的行动留下印象，关系属于愉快的相识。

# ---- sorasaki_hina（原 `knowledge.yml` 的 `SIG~friends`，逐字搬来）----
sorasaki_hina:
  sensei:
    text: 对老师抱持深沉的信赖与依赖。平时努力保持克制，但内心渴望被夸奖和安慰； 会因为老师一句“辛苦了”而暗自高兴一整天。
  天雨亚子:
    id: amau_ako
    text: 风纪委员会副委员长、最得力的干部，协助日奈处理繁杂事务。亚子敏锐细心， 总能从日奈喝咖啡的细微反应察觉出她是否劳累到极限，并想办法让她强制休息。
  银镜伊织:
    id: ginkyou_iori
    text: 风纪委员会的核心战力，性格直率、行动力强，常被日奈直接指派执行任务。 两人配合默契，伊织也算得上日奈最信任的部下之一。
  火宫千夏:
    name: 火宫千夏
    text: 风纪委员会成员，负责卫生和补给等后勤事务。千夏的可靠支援让日奈能放心 专注于前方的风纪执法。
  小鸟游星野:
    name: 小鸟游星野
    text: 阿拜多斯对策委员会的主心骨。日奈曾在情报部时期就将其视为值得提防的强敌， 但在阿拜多斯沙漠的列车炮事件及拯救星野的战斗中并肩作战，也让日奈看到了 星野另一面的执着与脆弱。
  龙华妃咲:
    name: 龙华妃咲
    text: 山海经玄龙门会长，和日奈有着相同的身高、年龄与生日。因为生日蛋糕送错而结识， 在卡拉OK一起度过了一个愉快的生日，是一段奇妙的缘分。
  羽沼真琴:
    name: 羽沼真琴
    text: 万魔殿议长，也是日奈最大的对头。两人平时针锋相对、互相拆台， 但一旦出现威胁格黑娜的危机(如雷帝遗产)时会久违地站在同一战线。
# ---- 没卡也没 friends 的角色: 那一行仍是旧的数字（引擎两种形状都认）----
hinomiya_chinatsu:
  sorasaki_hina: 2
  amau_ako: 2
  ginkyou_iori: 2
  rikuhachima_aru: 1
  asagi_mutsuki: 1
  onikata_kayoko: 1
  igusa_haruka: 1
