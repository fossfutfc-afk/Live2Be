# places.yml — 地点检索语料（RAG 跨语言, core/rag/place.py 消费）
#
# 结构: places: {scene_id: [别名...]} —— scene_id 与 assets/_director_whitelist.json
# 的 common_scenes 对齐（导演 place 词表的视觉后端）。别名是中/英/日混排的自然
# 说法, embedding 时每条别名独立成向量、取 scene 内最大值——LLM 说"天台"、
# "rooftop"、"屋上"都能命中 school_rooftop。
#
# 维护约定: 作者加场景 = 在 _director_whitelist.json 加 id + 本文件加别名
#（缺别名 → 该 scene 仍可被英文 id 拆词命中, 只是跨语言弱）。宁缺勿错: 检索
# 不到（低分）→ 上层保持上一场景, 不强行匹配。

places:
  # ── 学校 / 学园 ──
  class_room: [classroom, 教室, 班级教室, 教室の中]
  class_corridor: [class corridor, 走廊, 教学楼走廊, 廊下, 渡り廊下]
  class_stairs: [class stairs, 楼梯, 楼梯间, 階段]
