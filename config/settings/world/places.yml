  school_ground: [schoolyard, 操场, 校园空地, 校庭, 運動場]
  school_rooftop: [rooftop, 天台, 屋顶, 校舍屋顶, 屋上, 校舎の屋上]
  school_cafeteria: [cafeteria, 食堂, 学校食堂, 学生食堂, カフェテリア]
  school_cafeteria_chaos: [cafeteria chaos, 食堂混乱, 食堂大乱斗]

  # ── 学院都市 / 格黑娜 ──
