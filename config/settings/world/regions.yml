# regions.yml — 剧情地理 region 词表（DESIGN_PLACE.md 语义键层）
#
# 消费方:
#   - place_studio.py region 下拉（作者整理时标注场景归属）
#   - 语义实体表的 region 字段（子集注入: 每场候选 = 当前 region + 常驻通用）
#
# 结构: regions: [{id, zh, aliases}]
#   id      = 稳定锚（latin snake, 程序侧键值, 不改）
#   zh      = 官方中文主名（显示/注入/导出的 region 值, 归一终点）
#   aliases = 别译/俗称吸收集——⚠️ 用途（2026-09-05 作者定）:
#             同一地点的译名在汉化/社区/AI 侧并不统一（歌赫娜vs格黑娜、
#             沙勒vs夏莱、千禧年vs千年…），LLM 汇报或检索命中的很可能是任一
#             别译。aliases 的作用不是"记录别名"本身, 而是给归一化兜底:
#             任意别译/id 出现时都归一成同一个 zh 主名——
#             否则同一地点会因叫法不同裂成多个 region 分组, 子集注入就漏。
#             作者若听到新的不同译名 → 加进对应条目的 aliases, 别新建条目。
# 词表依据: 2026-09-05 用户提供的官方/常见地名表（含 3 个通用区域兜底）。作者可增补。

