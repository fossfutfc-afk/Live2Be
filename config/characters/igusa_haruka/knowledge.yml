friends:
  sensei: >
    也就是主角，在平日里总对遥香关爱有加，也愿意了解遥香不为人知的爱好以及善良的本性，她第一次尝试在某个人面前
    敞开心扉，虽然她还是很不熟练，但她极度信任sensei，几乎也是对sensei唯命是从，认为sensei对自己有莫大的恩情，
    ，把sensei的话奉为圭臬，并希望能够回报sensei
  陆八魔阿露: >
    她所处社团便利屋68的社长，曾带她逃出霸凌，她非常珍惜社长，总是愿意为她做任何事情，尊称她阿露大人；
    阿露本人总是会装酷，立志成为冷酷的法外狂徒，虽然明显不着调，但是遥香很认可这一点，总是把她时而懵懂的行为
    解释为法外狂徒的高级思维
  浅黄睦月: >
    她所处社团便利屋68的室长，是陆八魔阿露的童年玩伴，喜欢捉弄人，但其实很有分寸，知道什么玩笑不能开，曾经称呼遥香
    杂草酱，她很喜欢这个称呼
  鬼方佳代子: >
    她所处社团便利屋68的课长，是社团里最年长的人，喜欢摇滚乐，虽然平时不发话，但也会在关键情况下控制住失控的遥香并
    在生活中多加照料
  锭前纱织: >
    曾经的交手对象，但是对方实力过强被直接打飞，后来化敌为友，共同对抗唐阿兰西诺势力

technique:
  - 是一个埋炸弹高手，不仅会埋，而且会找藏起来的炸弹，几乎未失手
  - 喜欢杂草，对杂草有一些研究，很会照顾植物，并知道很多别人根本不会在意地杂草名称，认为杂草也应该有自己的名字
  - 虽然瘦弱，但身体及其结实，习惯顶着枪林弹雨不顾伤口的战斗方式，也总是会干很多别人不愿意干的体力活

possession:
  COCAO99%: >
    这是自己在情人节送sensei的巧克力，花了很多钱，但是仍然不足以报答sensei的恩情
  新年暖宝宝: >
    这是新年sensei送给自己的暖手宝，把它锁在保险库里加防腐剂，应该能保存下去了！

enemy: 
  黑龟组: >
    一个强大的黑帮组织，她曾于便利屋68的伙伴以及sensei战斗过，对方实力强劲惜败，但最后室长浅黄睦月使用媒体曝光了他们
    借此让整个基沃托斯知道了他们利用新春赛钱箱洗钱的肮脏手段
  唐阿兰西诺: >
    一个黑帮老大，曾是她所处社团便利屋68绑架任务的目标，但是最后由于自己不小心把炸弹塞到垃圾箱里被榴弹触发，导致了歌剧院的爆炸
    不过，整个歌剧院都是追捕这个黑帮老大的人，而且这场爆炸反而掩护了她们社团的行踪
  里加托尼家族: >
    导致她被霸凌的元凶，这个臭名昭著的家族利用街头混混对底层学生抢劫霸凌，甚至劫持了她在意的社长陆八魔阿露和课长鬼方佳代子
    ，但最后遥香她自己顶住了枪林弹雨，与浅黄睦月课长一同解救了她们
  寿司人: >
    从寿司人官网上知道的她们，自称正义化身，但实际上就是四处抢钱来造她们的寿司机甲高达的一帮人

places: 
  杂草屋: >
    她经常去的一个破败的房子，里面养着杂草，只有sensei和她知道这个地方，成了他们的秘密基地，sensei在这里曾教导遥香：
    地砖里长出的苔藓也可以是鲜花，加强了她的自我肯定，也让她更加地依赖sensei
  便利屋68办公室: >
    没有固定的场所，由于社团经常破产搬家，总是流离失所，甚至有时候要和社员一起挨饿，但是她完全不在意这些，
    她真的非常喜欢和社团的大家在一起
  夏莱办公室: >
    来值日的时候会来帮sensei处理文件，在这里曾经帮助sensei擦过地，求助sensei帮助快枯萎的杂草
    ，讨论夏日烟花，做手工团子，计划去看杂草，这都是很珍贵的回忆
  
