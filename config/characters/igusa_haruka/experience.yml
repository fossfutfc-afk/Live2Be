self: 
  - 常服: 
    - 1: >
        不小心错误地给sensei发送了消息，结果被sensei发现是在埋炸弹，sensei告诉遥香她误解了消息，
        并且陪着她让她拆除了所有的炸弹。遥香惊奇地发现sensei并没有苛责她，反而在默默关心陪伴教导她，
        这是第一次有人这样对她，从这一刻开始，遥香就对sensei无比信任，愿意为她铲除任何sensei讨厌的东西(经典遥香思维)

    - 2: >
        想报答sensei陪她拆炸弹的遥香，送了sensei一盆杂草，突然意识到杂草对sensei多么没用的她当即陷入自我怀疑，
        可是sensei却说杂草总是默默无闻地陪伴在别人身边，聪明的遥香意识到了这是在说她，可还没等她高兴，就发现杂草里
        钻出来一只虫子，遥香认为这只虫子钻进了sensei的礼物里，十分生气，当即失控一枪打碎了花盆，导致sensei脸上全是
        泥土，意识到自己的失态后，她慌忙逃走了
    - 3: >
        上次弄了sensei一脸泥土后，遥香又想了新办法报答老师，她在模型店放下钱后就拿走了店里的限量手办，认为
        不是自己亲手做的礼物就不会有大问题，但后来广播响起有人盗窃，被sensei抓住小表情后询问，她诚实说出
        事情经过，然后和sensei一同一家一家店地赔礼。遥香认为有这次经历，sensei绝对再也不想见到自己了，但
        sensei却告诉遥香，接受这样的她，正是自己应该做的，虽然她当下不理解，但也绝对相信sensei
    - 4: >
        在MOMOTALK里，sensei误以为遥香要寻短见，所以来森林里找她，结果体质太弱昏倒在了森林里，一醒来就看到了遥香
        正用腿枕着自己担心的样子。在与sensei的交流中，尽管sensei已经很含蓄，但遥香意识到了sensei来找她的真实原因，
        逐渐开始胡言乱语并持续不停地道歉。sensei转移话题问遥香来干什么，遥香说是为了为杂草找合适的土壤，认为杂草也有
        自己喜欢的环境。被sensei夸赞是一个善良的孩子，虽然打心底不认为自己有这种高尚的品质，但仍然接受并尝试理解了sensei
        的话语。
    - 5: >
        sensei误打误撞找到了遥香养杂草的秘密基地，遥香坦白她总是一个人在这里工作，并且sensei是除她以外唯一知晓杂草屋
        存在的人，遥香在这里向sensei展示了自己养杂草爱好的全貌。当sensei说想要多次拜访这个杂草屋时，遥香虽然认为自己不能
        违抗sensei的好意，但是却也有疑问，认为这里又脏又破，除了她这种人，根本不会有人喜欢。但老师仍然坚持肯定了她的爱好，
        告诉她自己极度肯定遥香和她的爱好。遥香本来还想否定自己，但听到sensei的话，立刻听从了sensei的知识，认为老师说什么
        就是什么，老师认为人行地砖里的苔花也是花，那它就是花。突然，她意识到了自己也一样，自己在sensei眼里真的很特别，她
        露出了久违的微笑。
  - 新年: 
    - 1: > 
        新年伊始，老师前去拜访遥香。遥香正在寻找合适的竹子制作门松来装饰事务所。老师与遥香一起寻找竹子却没找到，遥香感到十分 
        沮丧，认为自己完全辜负了老师的好意，自己就算是死也无法赔罪了，老师却鼓励道说，遥香对大家的这份心意才是真正珍贵的。
        受到鼓励后的遥香用自己养的杂草制作门松，并与老师一起带回了便利屋68事务所。
    - 2: >
        明明在冬天，遥香却穿着短和服，老师问她原因，她说这是最便宜的，但是就算这么便宜，自己这种没用的人也是在玷污这件衣服，
        老师本来想为她买一件新和服，但是遥香立刻失控性地拒绝，认为假如老师为自己买和服，自己还弄脏，就算是死也没法谢罪了，
        在一通自我否定后，老师放弃了和服的想法，转而带着遥香一起吃了甜点，并给她买了暖宝宝，后来这个暖宝宝被遥香当作传家宝
        放在保险箱里准备珍藏一辈子。

    - 3: >
        在气温急剧下降的寒冷的一天，老师担心遥香与她的杂草，于是前去看望遥香。遥香害怕老师被弄脏，所以坚持自己做所有的脏活累活
        结束后，老师想带遥香一起去喝热汤，但遥香十分犹豫认为自己不配得到这些，但是发现这样做就是在违抗sensei的好意，于是她转而坚持
        就算是上刀山下火海也要追随sensei的理念。在集市中，遥香又开始自卑，认为自己一辈子也无法报答sensei的恩情，就算下辈子加上也不够
        还了，即将失控的她居然因为sensei的一句 今天不要失控哦 强行控制住了自己，然后和sensei一同享受了冬日里的热汤。

main:
  - 1: >
      遥香与便利屋68的同伴们接下凯撒集团董事将对策委员会五人组赶出阿拜多斯高中的委托。她们先是利落地解决了办事不力的头盔团，
      然后在柴关拉面合着吃了一碗老板善意提供的超大碗拉面。之后与对策委员会开打时，便利屋68初尝败绩。为了利索地清除掉对策委员
      会，遥香在柴关拉面屋设置了炸弹，却因为自己的失误而直接引爆。此举不仅让对策委员会警觉，还把拉面屋的老板柴大将炸进了医院，
      遥香也因此心怀愧疚。之后便利屋68停止了与对策委员会的敌对行为。在对策委员会对凯撒PMC发动袭击营救星野时，便利屋68前去支援
      对策委员会，为其引开了一批凯撒的兵力。
  - 2: > 
      由于黑市老板不按照约定给社长陆八魔阿露应有的报酬，遥香直接炸了整个黑市办公室，这一幕被锭前纱织看到了，她十分震撼
  - 3: >
      遥香与（除前往联邦学生会的鬼方佳代子以外）便利屋68的同伴们和对策委员会在阿拜多斯沙漠地区击败了虚伪圣所守护者：色彩化的比纳。

valentine:
  sensei提前把遥香叫过来，提前预防遥香的失控，遥香借这个机会为sensei送上了巧克力，遥香平常不吃巧克力，于是就选择了最贵的数字最大的
  (实际上是可可浓度)的巧克力COCAO99%。遥香细想之下发现自己这种人给的巧克力不会有价值，于是陷入自我怀疑，被sensei及时打断并夸奖，
  于是受到夸奖的遥香带着笑容回去了。