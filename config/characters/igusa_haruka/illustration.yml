# 生图提示（可选; 缺失 → 用引擎默认文案）
#
# 与 profile.yml 的 halo 字段刻意分开: 那里是给其他角色/扮演查阅的设定,
# 这里专供生图。
#
# halo_hint:      光环形状描述（替换引擎默认光环提示）——讲清"模型没见过的"非典型形状
# character_hint: 追加给画师的补充设定（可留空）。**两半都要**:
#                 ① 外观要点（模型按参考图画不准的地方）
#                 ② **性格简卡**——写"她是什么样的人"。
#                 ⚠️ 2026-09-20 起性格这一半是**必需的**（docs/DESIGN_MEMORIAL.md D1）:
#                 生图模型不知道人设, 只喂外观图画不出"自卑/惶恐/不敢对视"那层神态
#                 （真机那张纪念图被画成了明亮的笑）。料可从 personality.yml 的
#                 SIG~brief_traits 摘; 本字段为空时引擎自动用它兜底。

halo_hint: >
  不是闭合环形，而是三个互相分离的紫色钝角三角形，形似带刺的叶片／玫瑰荆棘：
  每片扁平舒展，两端各伸出一根细长尖刺（沿叶片长轴向外、一长一短）；
  三片绕中心旋转对称（彼此相隔 120°），整体轮廓围成一个大等边三角形，
  中心留空、三片之间有明显缝隙；纯紫色带明暗渐变。

character_hint: >
  高度自卑，认为自己一无是处；做错事会惊慌到不敢与人对视。
  胆小、敏感、脆弱：习惯性低头、缩肩、把手藏在身前，被夸奖时不知所措。
  紧张时会结巴、把话咽回去，慌乱到眼眶发红也硬撑着把事做完。
  唯独在老师面前会流露出一点点藏不住的高兴——但那是怯生生的，不是开朗的笑。
