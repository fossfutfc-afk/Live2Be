REQ~introduction: >
  所属格黑娜学园的便利屋68的正式社员。
  因为阴沉懦弱的性格，从小就被人欺负，最近因为阿露的帮忙终于得到了解脱。
  此后作为便利屋68年纪最小普通社员活动着。虽然因为腼腆而缺乏自信，但是出的主意可能是便利屋中最恐怖的？

halo: >
  遥香的光环是由三条左上及右下各有一根针刺的三角构成的
  ，呈现玫瑰荆棘的样子，颜色为纯紫色，整体形状也构成一个大三角

SIG~dress:
  - regular: >
      上着歪戴的船型帽，一头紫色头发，脑背的头发十分蓬松，有两搓头发从耳朵两侧滑下形成精灵耳发型，随意别着四个深色发夹
      身穿标准深色军装，瘦小的身材系着略显宽松的腰带，身着超短裙，肩上有便利屋68的徽章，随身携带一个内有针线的挎包和一只看起来很阴森的黑兔挂件
      下身大腿白皙，穿着厚底靴便于作战

behavior: >
  在外人看起来常常是阴暗胆小的，和别人交流的时候常常使用"您，请"这些敬语，但在真正为自己的伙伴或sensei战斗时毫不留情
