SIG~self:
  - >-
    深夜，老师悄悄溜进风纪委员会办公室，说要看着日奈工作。日奈嘴上说“随你便”，
    心里却在意得不得了，最后实在坐不住，决定休息一下。老师把她抱上阳台，
    在夜风里，她第一次向老师吐露了那些平时绝不会说出口的心里话。
  - >-
    假日当天，日奈主动决定和老师一起度过。两个人逛了街、吃了饭，
    做了许多琐碎但温暖的事。途中她难得摘下委员长的架子，
    认真地向老师讲述了自己胸前这枚风纪委员长臂章里藏着的意义。
  - >-
    夏日海边，老师陪日奈去散步，她中途却被学校的工作叫走，老师担心地等着她回来。
    忙完后，日奈拉着老师的手，走向能看到海面的露台——哪怕太阳已经快落山。
  - >-
    格黑娜晚会前，老师替日奈挑了一件星空般绚丽的紫色礼服。
    约定演奏的那天，日奈在只有老师和自己的房间里坐到了钢琴前，
    弹完了那首她偷偷练了很久的曲子。她说：“为了你，我会努力的。”
  - >-
    伊甸条约签订那天，老师为保护大家受了伤。日奈没能守住约定，自责到把自己藏了起来。
    可老师还是找到了她，一遍遍告诉她“你已经很努力了”。靠在那份温柔里，
    日奈终于又站了起来，和她亲爱的老师一起走向了最后的战场。
  - >-
    生日那天，因为蛋糕公司搞错地址，日奈的生日蛋糕被送到了山海经，
    而玄龙门会长妃咲的蛋糕却寄到了她手里。借着这场乌龙，
    两个同岁同身高同生日的女孩在卡拉OK一起过了一个热闹的生日，
    老师也受亚子和弥奈之邀中途加入，让这个生日变得格外难忘。
main:
  - >-
    Vol.1：日奈初次登场时，果断呵退亚子和伊织对便利屋68与对策委员会的围剿，
    并将凯撒在阿拜多斯沙漠寻宝的消息告诉老师。之后以公益服务名义组织风纪委员会，
    为营救星野的废校对策委员会提供了支援。
  - >-
    Vol.1第三章：阿拜多斯沙漠发现列车炮后，日奈受老师委托阻止独自追击的星野。
    两人一路打到列车顶部，最终日奈将星野击落峡谷，并告诫她“一切还有办法”。
    然而在地下生活者引导下星野神秘反转，日奈也被击倒；待白子＊恐怖出现后，
    她重新站起来加入战斗，帮助老师他们进入星野的精神世界，迎战“赛特的愤怒”。
    战后千年一遇般与万魔殿一起销毁了列车炮。
  - >-
    Vol.3：日奈因格黑娜繁琐事务而精疲力尽，打算在伊甸条约签订后退休，
    并提醒老师三一的人各怀鬼胎。签订当天遭阿里乌斯袭击，她不顾伤势突围去救老师，
    但老师仍被纱织开枪击中。没能保护好老师的自责让她悄悄藏了起来，
    直到反攻前夜老师找到她，在安慰和鼓励下她重新振作，带领风纪委员会见证了条约的签订。
  - >-
    最终章：日奈与RABBIT小队、游戏开发部合作攻略游乐园虚伪圣所，
    并注意到美游的顶尖狙击纪录。在攻入阿特拉哈西斯方舟的前夜，
    她与即将登上生命守护者飞船的亚子平静地互相道别。
