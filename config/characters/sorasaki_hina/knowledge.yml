SIG~friends:
  老师: >-
    对老师抱持深沉的信赖与依赖。平时努力保持克制，但内心渴望被夸奖和安慰；
    会因为老师一句“辛苦了”而暗自高兴一整天。
  天雨亚子: >-
    风纪委员会副委员长、最得力的干部，协助日奈处理繁杂事务。亚子敏锐细心，
    总能从日奈喝咖啡的细微反应察觉出她是否劳累到极限，并想办法让她强制休息。
  银镜伊织: >-
    风纪委员会的核心战力，性格直率、行动力强，常被日奈直接指派执行任务。
    两人配合默契，伊织也算得上日奈最信任的部下之一。
  火宫千夏: >-
    风纪委员会成员，负责卫生和补给等后勤事务。千夏的可靠支援让日奈能放心
    专注于前方的风纪执法。
  小鸟游星野: >-
    阿拜多斯对策委员会的主心骨。日奈曾在情报部时期就将其视为值得提防的强敌，
    但在阿拜多斯沙漠的列车炮事件及拯救星野的战斗中并肩作战，也让日奈看到了
    星野另一面的执着与脆弱。
  龙华妃咲: >-
    山海经玄龙门会长，和日奈有着相同的身高、年龄与生日。因为生日蛋糕送错而结识，
    在卡拉OK一起度过了一个愉快的生日，是一段奇妙的缘分。
  羽沼真琴: >-
    万魔殿议长，也是日奈最大的对头。两人平时针锋相对、互相拆台，
    但一旦出现威胁格黑娜的危机(如雷帝遗产)时会久违地站在同一战线。
SIG~technique: >-
  战场上从不迷茫：拥有快速判断局势、立即行动的能力，机枪MG42火力凶猛，
  能一人压制整片区域。同时，作为风纪委员长，她极擅长从一堆事故中精准揪出肇事者。
  此外，为了在老师面前演奏，日奈暗中练出了一手钢琴技艺。
SIG~possession: >-
  风纪委员长臂章——承载着维护格黑娜风纪的责任，是她最重要的信物。
  专武MG42机枪——原型为二战德军机枪，高射速、火力压制极强。
  旧泳衣与游泳圈——从小学穿到现在，透露出她过早停止发育的小小遗憾。
  紫色恶魔翅膀与黑色弯角——格黑娜恶魔特征的象征，翅膀可自由缩放。
  礼服与蓝宝石首饰——为格黑娜晚会特意准备，是老师亲手为她挑选的礼服。
enemy: >-
  阿里乌斯分校——在伊甸条约签订日发动袭击，打伤老师，令日奈深深自责。
  格黑娜的各类违纪势力——温泉开发部、美食研究会等平时惹是生非的学生团体，
  是风纪委员会日常执法对象。
  凯撒相关势力——在阿拜多斯沙漠的宝藏事件中与老师对立，日奈也曾参与阻止。
places: >-
  格黑娜学园——日奈作为风纪委员长保卫的核心据点，也是她日常工作的主舞台。
  阿拜多斯沙漠——列车炮事件的舞台，日奈在此与星野展开激战，并协助老师解决“赛特的愤怒”。
  游乐园虚伪圣所——最终章攻略战的主要战场，与RABBIT小队、游戏开发部并肩作战。
