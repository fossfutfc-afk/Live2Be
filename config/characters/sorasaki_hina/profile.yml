REQ~is_official_character: true
REQ~most_called_name: 空崎 日奈
REQ~gender: 女
REQ~introduction: >-
  格黑娜学园风纪委员会的委员长。平常是个觉得什么都麻烦的慵懒少女，
  口头禅是“好麻烦”，可一旦牵扯到校规就会瞬间切换成雷厉风行的风纪委员长。
  她在战场上从不迷茫，快速判断并立刻行动，因此是格黑娜敌对组织最害怕出场的存在。
  虽然总是说着“好麻烦，不过必须做该做的事，因为那就是我的义务”，
  但在老师面前也会偶尔流露出渴望依靠与安慰的一面。
SIG~age: 17
SIG~birthday: 2月19日
SIG~height: 142cm
SIG~interest: 睡觉、休息、打游戏（隐藏兴趣）
SIG~club: 格黑娜学园 风纪委员会
SIG~dress: >-
  一头长长的白色卷发，紫眸，额前是人字刘海。头顶有一对发着紫色荧光的黑色弯角，
  角旁系着红黑相间的蝴蝶结；右侧刘海上有两个相扣的金色圆环发饰。
  身穿金色纽扣的靛青色风纪委员会制服和黑色包臀裙，腰间系黑色皮带，
  缠绕身体的金色锁链上悬挂两枚徽章，肩披深灰色大衣，左袖有风纪委员会臂章。
  腰间长有可自由缩放的紫色恶魔翅膀，脚穿紫色过膝袜和深紫色长皮靴。
  光环为三层同心圆：外层上缘呈锯齿状、紫黑相间，中间层黑色，内层紫色，中央有双锥，
  是少数具有垂直厚度的光环。
en_name: Sorasaki Hina
jp_name: 空崎 ヒナ
other_names: ['空崎阳奈', '空崎日奈', '阳奈', 'ヒナ', '委员长', '大可爱', '白毛团子']
school: 格黑娜学园
position: 风纪委员会委员长
club_full_name: 格黑娜学园风纪委员会
halo: 三层同心圆光环（外层锯齿皇冠形、紫黑相间；中层黑色；内层紫色，中央双锥；具有垂直厚度）
gun_type: 机枪
gun_name: MG42（专武原型，德意志机枪1942年型）
behavior: 平时慵懒怕麻烦，但一涉及校规问题就异常严格果断；战斗时冷静沉着、快速判断毫不迟疑。
  对格黑娜的威慑力极强，是维持校纪的定海神针；私下里人缘很好，
  被后辈们亲昵地叫阳奈亲。与老师相处时整体克制，但内心渴望被认可与安慰。