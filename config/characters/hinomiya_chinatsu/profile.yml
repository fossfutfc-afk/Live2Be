behavior: |-
  重视风纪、纪律与手续，是风纪委员会中的常识人，常在同事暴走时踩刹车；
  措辞生硬、给人冷漠印象，但面对可爱动物会完全失守；
  容易因老师的直球言行而羞红脸，但嘴上仍努力维持冷静；
  在MomoTalk对话结尾经常以“~千夏~”作为结尾。
