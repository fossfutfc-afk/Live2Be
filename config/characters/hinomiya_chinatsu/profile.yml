REQ~is_official_character: true
REQ~most_called_name: 火宫 千夏
REQ~gender: 女
REQ~introduction: |-
  格黑娜学园风纪委员会的保健担当。原本属于急救医学部，后转调至风纪委员会。
  作为重视风纪、纪律、手续的风纪委员会中少数的有常识的人，她会在亚子和伊织等风纪委员即将暴走时踩下刹车。
  措辞生硬，给人冷漠的第一印象，但面对可爱的动物时却完全无法自拔，是个温柔又容易害羞的少女。
  平时随身携带爱用的手枪“Support Pointer”，比起对人开火，更常用于业务上的指示和指示位置。
SIG~age: 15岁
SIG~birthday: 8月22日
SIG~height: 159cm
SIG~interest: |-
  阅读哲学书；
  照看和接触可爱的小动物（会因此失去平常心）；
  喜欢红色的事物（但明确表示并不喜欢血）；
  似乎在温泉纪念品店时对蝴蝶结饰品感兴趣。
SIG~club: 格黑娜学园 风纪委员会（保健担当；原属急救医学部）
SIG~dress: |-
  粉发红瞳，戴眼镜，留双下马尾，发间佩戴蝴蝶结发箍，耳尖微尖。
  身着格黑娜风纪委员制服：深色外套搭配百褶裙、连裤袜与中靴，手臂佩戴风纪委员袖章，胸口或手臂带有红十字救护标识。
  随身装备为爱用的手枪“Support Pointer”（原型为二战德国毛瑟M712速射手枪，使用20发弹匣）。
  温泉装扮时为浴衣、木屐、裸足（模型中穿鞋）。
