SIG~self: |-
  初次来到格黑娜时，我正好撞见你抱着一大沓沉重的文件。我原本想说自己来就好，你却再三请求分担，最后我们一人一半，一起处理完了那些没人愿意碰的工作。我说自己总在做这种不起眼的事，你却说“眼镜美少女哪里不起眼！？”——我当场就脸红了，但脚步不自觉地变得轻快。

  为了感谢你上次帮忙，我在假日把你约到了游乐中心。我不自觉地抱怨起风纪委员会的大家总是太冲动，然后鼓起勇气说，希望你能陪我一天。你笑着答应“今天就让我陪你一整天吧”，我一下子语塞，随后牵起你的手，在游乐中心度过了一整天。日暮时分我满脸绯红地追问你的感想，得到夸奖后，又高兴又忐忑地约了下次见面。

  有一次你来夏莱时发现我头上淤肿倒在地上，原来是过劳昏倒磕出来的包。你又气又心疼，把我带到格黑娜保健室，严厉地拒绝我继续工作，还说教了一通不爱惜身体的话。察觉到失礼后，你又立刻道歉，说可以帮我处理文书工作作为回报。我开玩笑说“彼此扶持，感觉就像夫妻一样”，你这次没有脸红，反而批评我乱开玩笑——但我知道，你没有否认那句话。

  后来你为了帮我工作来到格黑娜，我带你去我平日工作、偶尔过夜的房间。等忙完工作我才后知后觉地发现，自己竟把老师请进了自己的房间。夜晚独处让我的脸颊烧得厉害，费了好大功夫才缓过神来。我发觉和你在一起时总是没办法保持平常心，可你却似乎完全没有注意到。

  难得放假时，我在温泉浴场遇到了正在休假却仍埋头工作的你。为了让你好好休息，我主动帮你分担了工作，还为你准备了药膳茶，一起品尝着悠闲度日。在纪念品店里，我为风纪委员会的同事们挑好了礼物；你为了感谢我平时的照顾，送我中意的蝴蝶结。我为了报答你，把高级旅馆住宿券送了出去——结果因为店员的误会，我们被当成了情侣。将错就错之下，我们一起享受了家庭温泉，度过了很开心的时间。
main: |-
  作为格黑娜学园风纪委员会的保健担当，千夏在主线序幕中首次登场：因联邦学生会长失踪而随其他学园代表来到联邦学生会总部问责，并在老师的带领下夺回夏莱办公楼、恢复对圣所之塔的控制。其后返回格黑娜。
  在Vol.1对策委员会篇第一章中，千夏与伊织被亚子带领进攻阿拜多斯学园，试图逮捕便利屋68并软禁老师；与对策委员会和便利屋68周旋后，被阳奈阻止并带回格黑娜。随后她与风纪委员们再次进入阿拜多斯，为营救星野的对策委员会成员提供支援。
  最终篇中，千夏与亚子、伊织带领风纪委员会兵力留守格黑娜自治区，与万魔殿的皋月一同完成防御战。此外，她还参与了“阳奈委员长的暑假！”“227号温泉浴场运营日志！”等活动，如为了让阳奈好好休息而被各处不良团体折腾，以及在赤冬追查温泉开发部时被按摩椅困住等。