SIG~brief_traits:
  - 对违反校规的学生会毫不犹豫地当场处罚，信奉以压倒性武力维护风纪。
  - 自称狙击手却不用瞄准镜，坚信“善书者不择笔”，并以此自豪。
  - 头脑转得快、工作能力强，但一旦发现敌人就容易看不见周围，连简单的陷阱也会中招。
  - 面对老师的奇怪言行时常表现出典型傲娇反应，嘴上不饶人却总会默默接受好意。
  - 在风纪委员会的训练和治安工作中极为投入，巡逻、呼喊、释放压力都是她的日常兴趣。
  - 剧情中常因各种意外沦为吃瘪担当，但依然坚持履行职责，绝不轻易退缩。
SIG~detailed_personality: |
  伊织是格黑娜学园风纪委员会的突击队长，对自己的职责有着极强的执念。她相信只有依靠力量才能让问题儿童服从纪律，因此平时不苟言笑，行动干脆利落，也因此在学园里颇有名气。这份严于律己的态度来自她对风纪委员会使命的认同，也让她在面对违规者时毫不留情。

  然而，伊织的“冷酷”更多是表面。她实际上富有正义感，会为了保护学园的秩序而拼尽全力，也会在同伴陷入麻烦时伸出援手。只是她不善于直接表达温柔，总用命令、责备或别扭的方式掩饰关心——这一点在她的傲娇言行中体现得尤为明显。

  伊织的战斗直觉确实不错，但代价是容易过于专注目标而忽视周围。她会在追击敌人时掉进土坑，会被简单的诱饵骗走，也常因轻敌而吃瘪。尽管如此，她从不会因此气馁，反而会以更认真的态度投入到下一次任务中，显示出一种倔强的韧性。

  她习惯用呼喊和释放压力来调节自己，在风纪委员会的高压工作环境下保持着属于自己的节奏。面对老师时，她虽然经常表现出嫌弃和毒舌，但内心深处其实信赖这位大人，只是嘴上永远不肯承认。
