SIG~self:
  初次见面: 老师前往格黑娜学园搬救兵时，被伊织拦下刁难，要求老师跪下来舔自己的脚。没想到老师毫不犹豫照做，正好被委员长日奈看到，让伊织和日奈一起给老师贴上了“变态大人”的标签。此后伊织对老师始终带着又嫌弃又无可奈何的态度。
  下水道误会: 老师只是想捡掉进下水道的硬币，却被伊织当成想偷窥女学生裙底的变态。解释清楚后伊织虽然相信了老师，却又因为老师一句“在低一些的位置更能看到伊织的腿”而加深误会，认定老师是个奇怪的大人。
  午睡石板: 伊织在格黑娜学园中庭撞见老师躺在石板上午睡，觉得不可思议。老师却说被石板刺激背部很舒服，伊织亲自试了一下也无法忍受，从此更加确信老师是个抖M。
  纪念册风波: 伊织在黑市抓到了买东西的老师，却发现老师买的是自己小学毕业纪念册。老师不仅被伊织狠狠骂了一顿，还被没收了纪念册，让伊织又羞又恼。
  保健室包扎: 伊织作战时受伤，够不到后背，只好请老师来保健室帮忙包扎。她嘴上说着“谁会因为想被你治疗而故意受伤”，却还是预约了老师下一次的治疗服务，傲娇本色尽显。
  陷阱救援: 伊织追击敌人时掉进地洞，出于保密只能让老师来救。老师到了才发现那陷阱几乎有眼睛就能躲开，还拍了照片才把她拉上来。出来后伊织毫不意外地踢了老师一脚，但照片始终没能删掉。
  泳装夏日: 泳装活动中伊织为了学游泳偷偷买了小鸭子游泳圈，被老师发现后破罐破摔说出自己其实不会游泳。老师帮她练习游泳；后来又因老师在自己的沙子上掺水泥而气恼不已，还曾把毯子借给被淋湿的老师，却又因老师闻毯子的话立刻抢了回来。
main: 首次登场于Vol.1阿拜多斯对策委员会篇第1章第20话，受亚子命令带队进入阿拜多斯学生自治区抓捕便利屋68和老师，与对策委员会和便利屋68发生冲突，后在日奈介入下撤退，并被罚写两万字检讨。之后为了拯救星野，老师来到格黑娜搬救兵，伊织刁难老师舔脚。随后伊织与千夏、日奈一同出击，阻击凯撒集团PMC。在Vol.3伊甸园条约篇中再次登场，条约签订期间受伤，老师苏醒后重新加入战局，对抗阿里乌斯与圣徒会的入侵。在Vol.最终章负责格黑娜自治区的防御工作。此外还活跃于风纪委员会社团剧情、美食研究会、供给部以及多期活动剧情中，屡屡吃瘪却始终坚持风纪委员的职责。