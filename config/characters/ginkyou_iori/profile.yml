SIG~dress: 白色长发梳成双马尾，头顶戴着兔耳蝴蝶结发饰。拥有褐色皮肤、尖耳朵和红色的眼睛，身后拖着细细的箭头尾巴，光环为浅紫色的双同心圆，内侧圆环的四点、八点、十二点钟方向各有一条细线向外延伸，呈现准星结构。制服为格黑娜风纪委员会的深色制服搭配领带、袖章与手套，着黑色及膝袜和中靴，整体形象冷峻干练。泳装版则佩戴太阳镜、穿比基尼与凉鞋，常在躺椅上享受日光浴。
