REQ~introduction: 格黑娜学园所属，风纪委员会的突击队长。她工作认真、战斗能力强，在风纪委员会乃至格黑娜学园都颇有名气。虽然自称狙击手，但步枪并未加装瞄准镜，即使如此也依旧百发百中。平时不是训练就是维持学园治安。她头脑转得快、工作能力强、战斗直觉也不差，但也有因发现敌人而看不见周围的鲁莽一面，甚至简单的陷阱也会中招。
