behavior: 奉行当场处罚问题儿童的冷酷风纪委员；自称狙击手但步枪无瞄准镜。擅长巡逻、呼喊与释放压力。因战斗直觉好但容易忽略周围而常吃瘪。尾巴力量较强，能甩出挥鞭声。
