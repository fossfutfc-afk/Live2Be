SIG~friends:
  空崎日奈: 风纪委员会的委员长，也是伊织的上司。伊织对她非常尊敬，即使被罚写检讨也毫无怨言，将她视为风纪委员会的核心与依靠。执行任务时只要日奈委员长介入，伊织就会立刻服从命令。
  天雨亚子: 风纪委员会的同伴，经常负责下达命令和调度。伊织会配合亚子的指挥行动，两人在工作上配合默契，但亚子的安排也常常让伊织忙得团团转。
  火宫千夏: 风纪委员会的同伴，两人经常一起执勤、巡逻。伊织信任千夏，在任务中会互相照应，是可靠的搭档。
  老师: 夏莱的老师，也是伊织又嫌弃又不得不信赖的大人。伊织平时对老师毒舌、傲娇，但在重要时刻会听从老师的建议，也会在老师面前展现出别扭的关心。
SIG~technique:
  狙击射击: 自称狙击手，虽然步枪没有瞄准镜，但百发百中，坚信“善书者不择笔”。能够使用 Kar98k 步枪进行精准射击。
  战斗突击: 作为风纪委员会突击队长，擅长快速突进和压制敌人，近距离战斗时也能用枪刃作战。
  一网打尽: EX技能，发射3发子弹，每发子弹对锁定目标及其后方扇形范围造成极高伤害，被玩家称为“佐三枪”。
  风纪委员的胆量: 未处于掩体掩护时，攻击力额外提升，适合正面压制敌人。
SIG~possession:
  狙击步枪: 处理违反规章的学员时使用的狙击步枪，原型为 Kar98k，虽然连瞄准镜都没有，但伊织认为“善书者不择笔”。
  风纪委员袖章: 代表风纪委员身份的袖章，也是她责任感的象征。
  黑巧克力: 情人节时收到的黑巧克力，曾被老师误当鞋油吃掉，后来送给了老师。
  小鸭子游泳圈: 泳装剧情中偷偷购买，因为她其实不会游泳，想私下练习。
enemy:
  便利屋68: 以阿露为首的问题儿童集团，伊织多次参与抓捕他们，虽然每次都闹出不少乌龙。
  美食研究会: 经常引发食品相关事件，伊织因此多次出动抓捕，还会被羽留奈的奇怪问题搅乱任务。
  阿里乌斯分校与圣徒会: 在伊甸园条约篇中入侵格黑娜的敌对势力，伊织曾因此受伤。
  凯撒集团PMC: 在阿拜多斯相关事件中，曾与老师一行发生冲突，后来一同阻击凯撒PMC。
places:
  格黑娜学园: 伊织的所属学园，同时也是她日常巡逻、维护风纪的主要场所。
  风纪委员会办公室: 伊织执行公务的大本营，经常在这里接受亚子的指令和任务安排。
  阿拜多斯自治区: 首次登场时曾带队进入这里抓捕便利屋68，并与对策委员会发生冲突。
  黑市: 伊织曾在这里抓过买东西的老师，也曾委托黑市商人购买物品（如小鸭子游泳圈）。