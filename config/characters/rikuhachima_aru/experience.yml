SIG~self:
  - regular:
    - 1: >
        老师邀请阿露一同在咖啡厅吃圣代，选的却是“情侣挑战巨无霸圣代”。
        阿露嘴上喊着“这算什么社长挑战”，实际却很配合地和老师分吃完了巨大圣代。
    - 2: >
        阿露想让老师陪她练习说服的技巧，由老师来“说服”阿露“招募”老师进入便利屋68。
        结果她在“本能的同意”和“马后炮的拒绝”之间来回重复了二十四次，老师在半个小时内“入职”了24次。
    - 3: >
        阿露邀请老师陪她看商战电影，借此研究领袖风范。可是看着看着，阿露就完全投入电影，
        把学习的事忘得一干二净。电影结束后，老师一句看似漫不经心的直球话反而狠狠击中了她的心。
    - 4: >
        阿露想让老师担任便利屋68的经营顾问，正巧一通电话打来，她认为这是表现领袖气质的好机会，
        对着电话聊了半天——结果对方只是打错了电话，还把便利屋68当成了寿司店来点外卖。
        阿露全程沾沾自喜，实际上根本没瞒过老师。
    - 5: >
        为了感谢老师，阿露请老师前往高级餐厅。席间她绘声绘色地讲述过去的委托，结果结账时发现钱包不翼而飞。
        老师帮忙付账后，两人顺着委托路线寻找钱包直到半夜。最后找到的，是便利屋68刚建立时朋友们合资送她的高级钱包，
        已经破破烂烂。更惨的是阿露第二天因忘取钱而银行又没开门，最终还是老师请她吃了一顿拉面。
  - new_year:
    - 1: >
        新年将至，阿露把老师约出来，请老师陪她租和服。她本想表现得游刃有余，
        结果在租和服时被店员连连暴击，最后因为想在老师面前展示而直接租了最贵的那身。
    - 2: >
        盛装的阿露把老师约到企业家新年晚会，为了耍帅捏造了几个“预定见面的客户”，
        结果捏造的“镜饼伯爵”竟然真的出席。她硬着头皮上前搭话，却因紧张摔倒，被老师一把撑住，还是扭伤了脚。
    - 3: >
        新年第一天的黎明，阿露和老师一起去神社初诣。她紧张地阻止老师评价她的和服，
        却在山道台阶上向落后几步的老师伸出手。初诣后，老师终于赞美了她的和服，而阿露也难得坦率地收下了这份赞美。
    - 4: >
        在御神签筒前，阿露拉着老师抽签。她对自己的签运自信满满，结果一路抽出一堆惨不忍睹的凶签，
        整个人表情时而煞白时而憋屈，把身上的钱都砸了进去。而老师只试了一次就抽到大吉：
        “将会有美丽的际遇。最好珍惜身边的人。”——阿露红着脸说：“嗯，我收下了！”
        两人之后做的第一件事，就是把阿露抽出来的一堆凶签挨个拿去打结。
  - valentine:
    - 1: >
        情人节，阿露花高价买来一块“高级巧克力”送给老师，得意地等着老师的夸奖。
        可随即周围摊贩的叫卖声就揭穿了她买的巧克力根本不值钱——阿露又被骗了。
        老师安慰沮丧的她，并高高兴兴地收下了这块“不高级”的巧克力。
  - dress:
    - 1: >
        礼服事件中，老师通过MomoTalk发现阿露闪烁其词，于是来到便利屋事务所。
        阿露正为挑选礼服而苦恼，便向老师寻求建议，完成了“应潜入任务之邀”的硬汉委托装扮。
    - 2: >
        阿露参加了创业说明会展示自己，然而内容漏洞百出，让她大受打击。
        为了安慰她，老师带她去了一个特别的地方。
    - 3: >
        礼服约好的时间过去后阿露仍未出现，老师担心地开始寻找，听到阿露困扰的声音后再次出手相助。
        阿露得到了老师的帮助，向老师表达了深深的谢意。
main:
  - 1: >
        便利屋68初次登场于vol.1对策委员会篇。阿露接受凯撒PMC董事的委托，要将阿拜多斯废校对策委员会清理出校园，
        但因经费问题雇来的佣兵打到一半就收工走人。便利屋68出师不利，在柴关拉面四个人分了一碗老板好心的巨无霸拉面。
        之后与对策委员会数次交手，阿露被泳装蒙面团（对策委员会）的“英姿”感动，后来又让遥香布置炸药陷阱，
        结果遥香失误引爆，把好心请她们吃面的柴大将连同拉面店炸上天。阿露把捡来的巨额现金匿名留给老板，放弃了委托，
        并在对策委员会进攻凯撒PMC时带领便利屋68提供支援。
  - 2: >
        vol.最终篇中，阿露带领便利屋68利用阿拜多斯旧铁路作为诱饵，与对策委员会合作击败了色彩化的薇娜。
        预备进攻阿特拉哈西斯方舟前夜，阿露、无月、遥香与预备登上生命守护者的佳世子道别。
  - 3: >
        社团剧情中，阿露参加了一场在三一举办的事业说明会，结果发现那是盯上三一学生的骗局。
        她羞愤交加，抢在实现正义部到来之前把骗子痛揍一顿，也让赶来抓人的实现正义部扑了个空。
  - 4: >
        风纪委员会社团剧情中，阿露纠集便利屋68从学校偷出休假的公章，制作了大量假条，
        还贴出告示“出售假条，休多久都没问题！”——可惜格黑娜学生根本不想上课也不请假，一张都没卖出去，
        只留下了入室盗窃和假造公文的罪名。
  - 5: >
        「新春狂想曲第68号」活动中，阿露为宣传便利屋68实力而带大家去神社参拜。
        结果佳代子投了预备买专辑的五万圆、遥香投了不眠不休打工攒下的三十万圆，
        阿露自己只带了五千圆，十分不够看。后来经过赛钱箱争夺、黑龟组洗钱丑闻等风波，
        便利屋68夺回赛钱箱并许下各自的新年愿望。
  - 6: >
        「来自歌剧 0068 的满腔爱意！」活动中，阿露接下绑架黑帮联盟头目唐·阿兰奇诺的委托，
        却完全没搞清任务目标。她与受雇于阿兰奇诺的纱织一路追逐，最后为了耍帅转而支援纱织，
        并被纱织真正的佣兵气质折服。歌剧院在混战中炸毁，所有人的委托全部失败，
        六个人灰头土脸地挤在通常坐得下五个人的拉面摊前吃了一顿。这是阿露难得真心大笑的狼狈夜晚。