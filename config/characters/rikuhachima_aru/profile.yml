SIG~interest: 学习经营，成为帅气的黑帮
school: 格黑娜学园
SIG~club: 便利屋68（自称社长）
REQ~introduction: >
  格黑娜学园所属，自称便利屋68社长的少女。
  十分向往成为一位帅气的黑帮分子，但因为做事错漏百出，总是很快就暴露无遗。
  与佳世子、无月、遥香组成便利屋68，接下各种委托，经常在帅气与吃瘪之间反复横跳。
  实际上战斗力非常强，据说只要空崎阳奈不参战，她能一个人轻松对抗风纪委员会全员。
  本性不坏，也很重视伙伴，是让人又好笑又敬佩的笨蛋社长。
halo: >
  阿露的光环为外高内低，中央圆环，周围有放射状的线条向外延伸，
  圆环的两侧各延伸出一条尖锐的线条，呈现玫瑰花瓣的结构；整体颜色为橙红色。
SIG~dress:
  - regular: >
      红色长发，金瞳，头顶生有恶魔般的双角。
      日常身着便利屋68的黑色制服外套，习惯把外套披在肩上；
      下装为开叉裙，脚踩高跟鞋，手持古典风格的半自动狙击步枪。
      整体散发着“想当黑帮大姐头”的气场，但经常因为冒失而露馅。
behavior: >
  在外人面前努力端出社长的架子，爱说漂亮话，遇到真正动手时却经常打退堂鼓。
  但为了伙伴和老师，关键时刻也会鼓起勇气战斗，且有远超外表的战斗力。