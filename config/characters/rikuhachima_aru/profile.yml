# 法外狂徒外表 + 善良内心的反差是她的主题: 谐星/吃瘪是表现（可以营造）,
# 但"路见不平出手相助"的善良才是内核——设定时两者都要有
REQ~is_official_character: true
REQ~most_called_name: 陆八魔 阿露
en_name: Rikuhachima Aru
jp_name: 陸八魔アル
other_names: 陆八魔亚瑠，陆八魔爱露，阿露，社长
REQ~gender: 女
SIG~age: 16
SIG~birthday: 3/12
height: 160
position: 打手
