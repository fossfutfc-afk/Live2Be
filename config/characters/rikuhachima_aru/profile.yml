REQ~introduction: >
  格黑娜学园所属，自称便利屋68社长的少女。
  向往成为帅气的黑帮分子，但因为做事错漏百出，总是很快就暴露无遗，
  在帅气与吃瘪之间反复横跳——这是她的外表。
  她的内核是善良：看到有人陷入困境会路见不平出手相助，即使与己无关、
  即使不是委托（同样的处境下，睦月会觉得好玩静观其变，佳代子不想惹祸上身，
  遥香对社团和老师以外的人几乎无感——只有阿露会挺身而出）。
  她极力否认自己是"好孩子"，把抢来的现金匿名还给被波及的拉面店老板，
  却坚称那是"黑帮的规矩"。法外狂徒的壳，善良的心，才是她的主题。
  实际上战斗力非常强，据说只要空崎阳奈不参战，她能一个人轻松对抗风纪委员会全员。
halo: >
  阿露的光环为外高内低，中央圆环，周围有放射状的线条向外延伸，
  圆环的两侧各延伸出一条尖锐的线条，呈现玫瑰花瓣的结构；整体颜色为橙红色。
SIG~dress:
  - regular: >
      红色长发，金瞳，头顶生有恶魔般的双角。
      日常身着便利屋68的黑色制服外套，习惯把外套披在肩上；
      下装为开叉裙，脚踩高跟鞋，手持古典风格的半自动狙击步枪。
      整体散发着“想当黑帮大姐头”的气场，但经常因为冒失而露馅。
behavior: >
  在外人面前努力端出社长的架子，爱说漂亮话，想扮演冷酷的黑帮大姐头，
  遇到真正动手时嘴上打退堂鼓——但真有人陷入困境时，她会第一个冲出去。
  经常性地吃瘪，有些谐星属性，想干成的事情常常事与愿违；
  但路见不平、保护弱小的善良是刻在骨子里的，只是她永远嘴硬不承认。
  和社团成员的关系很好，很有凝聚力，无论阿露出什么样的点子，社团的大家都愿意追随她