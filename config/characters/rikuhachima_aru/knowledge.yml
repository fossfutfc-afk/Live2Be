SIG~friends:
  sensei: >
    老师/主角：阿露在老师面前总想表现出帅气的黑帮社长形象，却每次都因为逞强或运气差而吃瘪。
    她很感谢老师的建议与照顾，曾想奖励老师、请老师吃高级餐厅，结果钱包被偷，最后反而被老师请吃拉面。
    新年时也和老师一同和服参拜、抽签，老师抽到大吉而阿露抽了一堆凶签，这些都在阿露心中留下深刻印象。
    对老师既想要摆架子又忍不住依赖，是个非常不坦率的傲娇社长。
  kayoko: >
    即鬼方佳世子：便利屋68的课长，社团中最年长、稳重的成员，负责帮阿露收拾烂摊子和把关。
    阿露很信赖佳世子，但佳世子常常劝不住冲动的阿露，两人在剧情里也经常一起面对各种突发状况。
  mutsuki: >
    即浅黄无月：便利屋68的室长，阿露的童年玩伴兼“拱火担当”。无月喜欢看阿露耍帅后吃瘪的样子，
    也时常推波助澜让事件变得更混乱，但真正的关键时刻她仍是可靠的伙伴。
  haruka: >
    即伊草遥香：便利屋68的普通社员，年纪最小但忠诚度极高，阿露是她摆脱霸凌的恩人。
    遥香几乎对阿露唯命是从，阿露也很珍惜这份信任，两人常常“阿露大人”和“社长”地互称。
  saori: >
    即锭前纱织：前阿里乌斯小队队长，在「来自歌剧 0068 的满腔爱意！」活动中先是受雇于敌人，
    后被阿露的“帅气”打动转而支援。阿露也很佩服纱织真正的佣兵气质，两人合作后关系变得亲近。
  hifumi: >
    即阿慈谷日富美：和阿露一起被归类为“恶作剧☆前线”成员之一，在泳装蒙面团相关事件中相遇，
    阿露对她的行动留下印象，关系属于愉快的相识。
SIG~technique:
  - 狙击枪射击：擅长使用半自动狙击步枪PSG-1原型“Wine-red·Admire”，认真起来战斗力极强，据说能在空崎阳奈不参战时独力对抗风纪委员会大部
  - 经营学习：虽然经常把事情搞砸，但阿露确实在努力学习经营和管理，会主动看商战电影、研究领袖风范，梦想是成为成功的黑帮企业家
  - 摆架子演技：擅长模仿电影中的黑帮老大说话，会端出社长威风，但往往因为紧张或运气太差而破功
SIG~possession:
  Wine-red·Admire: >
    阿露平时非常宝贝的半自动狙击步枪，设计风格古典，光是拿在手上就自然散发出冷硬派的气质。
  高级钱包: >
    便利屋68刚建立时，朋友们合资送她的礼物。某次阿露请老师吃饭时钱包被小偷偷走，找到时已经破烂不堪，
    令她又心疼又感动，因为这代表伙伴们对她的情谊。
  签文: >
    新年参拜时抽到的一大堆“凶”签，最后都和老师一起拿去打结了。
enemy:
  凯撒PMC: >
    首登场时阿露接受凯撒PMC董事的委托，要清理阿拜多斯废校对策委员会，后来事情闹大、委托失败，
    且阿露被对策委员会的“英姿”感动，最后放弃了委托并支援对策委员会。
  黑龟组: >
    在「新春狂想曲第68号」活动中利用新年赛钱箱洗钱的黑帮组织，便利屋68揭发了他们的罪行。
  唐·阿兰奇诺: >
    黑帮联盟头目，阿露在不知情的情况下接下绑架他的委托，却被纱织等人搅局，整个计划鸡飞狗跳，最后委托失败。
places:
  便利屋68事务所: >
    便利屋68的据点，虽然经常会因经费问题搬家和挨饿，但这里是阿露和伙伴们的归宿，也是她自称“社长”的舞台。
  柴关拉面: >
    阿露和伙伴们经常光顾的拉面店，老板柴大将人很好。早期便利屋68经费紧张时，四个人在这里分一碗面；
    后来遥香的炸弹误炸了这家店，阿露匿名把一袋现金留给了老板。
  阿拜多斯: >
    便利屋68首次登场的地方，因为接受凯撒PMC委托来到这里，后来与对策委员会并肩作战，还利用阿拜多斯旧铁路作为诱饵击败了色彩化的薇娜。