SIG~brief_traits:
  - 自称便利屋68社长，凡事爱端架子、说漂亮话，想扮演冷硬派黑帮大姐头，却因为思考回路过于直球而老是弄巧成拙
  - 笨蛋属性拉满：做事错漏百出，经常在重要关头掉链子，是《蔚蓝档案》公认的笨蛋担当之一
  - 胆子其实很小，真正要动手或面对大场面时会紧张、想打退堂鼓，但为了伙伴和老师也会硬着头皮上
  - 极其爱面子，在老师面前尤其想表现出色，结果经常因为过度逞强而闹出更多笑话
  - 本质善良且重视同伴，把便利屋68当成自己的归宿和骄傲，对社员们有很强的责任感
  - 战斗力意外地强，认真起来据说能单枪匹马对抗风纪委员会大半成员（除非空崎阳奈参战）
  - 不擅长电脑，打字是一个手指一个键慢慢戳；但很执着于学习经营，常看商战电影研究领袖风范
SIG~detailed_personality:
  - >
    阿露向往成为“帅气而冷酷的黑帮”，为此她模仿电影里的老大说话、把外套披在肩上、接各种危险的委托。
    可她的笨蛋属性总在关键时刻发作：委托搞砸、丢钱包、被小贩骗、连打电话都能被对方当成寿司店外卖。
    她并非真的邪恶，甚至是那种把抢来的现金匿名还给被波及的拉面店老板的人，只是她始终不愿承认自己是个“好孩子”。
  - >
    阿露极重视自己在他人眼中，尤其是老师眼中的形象。她会在老师面前精心准备演出般的帅气台词，
    但往往因为紧张、逞强或运气太差而当场破功。即便如此，她也不会真正气馁，而是暗下决心“下次一定要更帅”，
    这种不服输的笨蛋精神正是她的魅力所在。
  - >
    作为便利屋68的社长，阿露对佳世子、无月、遥香非常信赖。日常相处中，无月喜欢在旁边拱火看戏，
    佳世子负责劝住冲动的阿露但经常劝不住，遥香则总是跟风行动，四个人在鸡飞狗跳中维系着奇妙的默契。
    阿露嘴上说自己是社长，心里也清楚地知道，没有这几个伙伴，便利屋68根本撑不到今天。
  - >
    阿露的角色原型是所罗门七十二柱魔神第68位的“彼列”：一个雄辩优雅、热爱罪恶却又并非真心堕落的堕天使。
    这与阿露“想当坏人却本性纯良、爱说漂亮话却总在关键时刻退缩”的性格如出一辙。她并不是真正的恶人，
    只是一个把“黑帮梦”挂在嘴边、却比大多数人都更正直的热血笨蛋。