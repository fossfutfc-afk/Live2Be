SIG~self:
  regular: >
    初次在路边被警察盘问时，是老师出手解围。佳代子向老师解释自己只是在喂野猫，并抱怨了长相带来的麻烦。
    之后在便利屋68办公室，老师帮忙打扫，两人一起度过了一段安静时光。
    佳代子曾向老师推荐喜欢的重金属乐队，老师给出负面评价后她不甘心地继续安利第一张专辑，让老师听到耳朵长茧。
    下雨天，老师忘了带伞，佳代子把多备的伞借给他。送伞的路上，她带老师去看自己喂的流浪猫，并说“明天就又能见面了”。
    两人在唱片行偶遇，佳代子推荐了舒缓的爵士乐，打破老师对她乐品的刻板印象，还交换了彼此喜欢的音乐。
  new_year: >
    新年时期，佳代子为了购买和服去和服店，因沟通困难而困惑，幸好老师路过帮忙，顺利买到心仪的和服。
    除夕夜两人相约去听除夜钟，但钟在维修，计划落空。回家路上，他们聆听首班电车的声响，一起迎来新年。
    和老师一起去买护身符时，由于寒冷喝了甜酒。佳代子被猫声吸引离开，被老师发现她在模仿猫叫玩耍，害羞地将一切归咎于甜酒。
    新年伊始，为了让忙碌的老师放松，佳代子带他去听和式金属摇滚的现场演出，打破了老师原本对“和乐器”的雅乐想象。
  dress: >
    接到佳代子的联络后，老师在歌剧院附近的窄巷与她交谈。佳代子穿着礼服，与平时不同，但依然淡然自若。
    在便利屋事务所，老师看到随意放置的礼服，两人交谈后老师提议一起吃晚餐。
    之后佳代子身穿礼服等在事务所，想要为之前的事表达感谢。她私下对老师说，很多话不希望别人听到。
main: >
  Vol.1对策委员会篇首次登场。与便利屋68其他成员一起击败头盔团，在柴关拉面与对策委员会相遇。
  后来虽然接下凯撒集团的委托，但在得知内情后放弃委托，并在对策委员会营救小鸟游星野时前去牵制凯撒PMC部队。
  最终篇“虚伪圣所”事件中，应老师联络前往夏莱组建紧急对策委员会。攻克虚伪圣所后，作为舰桥成员登上生命守护者飞船参与进攻阿特拉哈西斯方舟，之后和其他学生一起被老师传送回地面，迎接了降落时失去衣服的老师。
  活动“新春狂想曲第68号”中，为响应亚瑠的“面不改色投入大笔香火钱”计划，投入五万圆，并卷入塞钱箱争夺战。
  情人节活动中，购买了喜欢的乐队的情人节专辑，将附赠的乐队Logo巧克力送给老师，随后特意强调没有情人节含义。
  活动“来自歌剧0068的满腔爱意！”中，被迫参与绑架黑帮联盟头领唐·阿兰奇诺的委托，在歌剧院与老师偶遇时向他求情，并约定用对讲机联系。最终三个委托都失败，与老师、纱织一起在路边摊吃面。
