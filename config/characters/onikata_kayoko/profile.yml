SIG~interest: 收集音乐CD（从舒缓爵士到重金属摇滚均有涉猎）；最喜欢重金属乐团“黑色死亡毒药”；在巷子里喂流浪猫
school: 格黑娜学园
SIG~club: 便利屋68（课长）
REQ~introduction: >
  格黑娜学园所属，便利屋68的课长。
  虽然天生长相凶恶、冷若冰霜，经常被误解为不良少女，但本人其实没有恶意，只因为沉默寡言反而让人更加害怕。
  她内心温柔可靠，是社团里最年长的成员，也是唯一的常识人，经常为社长亚瑠的离谱计划收拾残局。
  喜欢收集音乐CD，最钟爱重金属乐团“黑色死亡毒药”。闲暇时会在小巷里喂流浪猫。
  对老师怀有信任与感激，曾约定“我要帮助老师”。
SIG~dress:
  - regular: >
      黑色挑染刘海的白色主发与黑色高马尾（实际为发根到发梢的白黑渐变），红色眼眸，头上有黑色的角。
      常穿黑色连帽衫，搭配运动鞋和耳钉、项链，腰间佩带手枪“Demon's Roar”。整体气质冷峻，像不良少女。
  - new_year: >
      在“新春狂想曲第68号”中穿着和服，搭配木屐、足袋、头花、发夹，言行得体有威严。
  - dress: >
      在歌剧院活动中穿着晚礼服，发型改为Half-up，搭配毛衣、萌袖、高跟鞋，别有优雅气质。
position: STRIKER（辅助）
gun_type: HG（手枪）
gun_name: Demon's Roar（原型疑似HK P30S）
halo: 灰白色双层五边形光环，外层五边形其中三边有尖角延伸，呈玫瑰枝干结构，外高内低。
behavior: 平时沉默寡言，表情冷淡，但行动可靠；会默默照顾别人，对猫非常温柔；遇到夸赞会害羞地否认；对待委托有专业态度。
