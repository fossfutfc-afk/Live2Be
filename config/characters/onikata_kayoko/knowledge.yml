SIG~friends:
  老师: >
    最初在路边被警察误认为可疑人物时被老师搭救，因而认识。之后老师在便利屋68帮她打扫、听她推荐的音乐、雨天借伞等，两人逐渐亲近。
    佳代子把老师视为少数能理解她的人，愿意协助老师的工作，并说“我要帮助老师，因为这是约定”。她也会在雨停后说“这样，明天就又能见面了”，透露出想再见到老师的心情。
  陆八魔亚瑠: 便利屋68的社长，常常异想天开搞出大计划。佳代子虽然经常无奈，但知道亚瑠并非恶意，也会认真辅助她。在“新春狂想曲”中甚至为了亚瑠的面子，把自己准备买专辑的五万圆投入塞钱箱。
  浅黄无月: 便利屋68成员，总是乐呵呵地煽动局势、享受混乱。佳代子对她的行为感到头疼，但也已经习惯，两人配合还算默契。
  伊草遥香: 便利屋68年纪最小的成员，性格胆小软弱，偶尔又会展现疯狂。佳代子作为年长者和课长，会多加照顾。
  天雨亚子: 风纪委员会成员。佳代子曾说过“亚子还是和以前一样，一如既往的死脑筋”，暗示两人在加入便利屋前可能就认识，可能是万魔殿时期的旧识（推断）。
  空崎阳奈: 风纪委员会委员长，在便利屋68卖假假条事件中有交集，佳代子对此很无奈。双方并非敌对。
  锭前纱织: 阿里乌斯特殊小队成员，在“来自歌剧0068”活动中共同行动，虽然最终委托都没完成，但一起在路边摊吃面，关系不错。
  对策委员会: 在Vol.1中与对策委员会合作，曾一起击败凯撒集团、营救星野，结下友谊。
SIG~technique: >
  手枪射击：使用随身手枪“Demon's Roar”，威力与声音都很大，平时会装消音器。
  恐惧控制：EX技能“恐慌扩散者”能让敌人陷入恐惧，基本技能“恐慌射击”也有概率恐惧敌人。
  潜入作战：礼服形态下擅长潜入与暗杀，能利用“潜入行动”状态大幅提升暴击伤害。
  音乐素养：熟悉各种音乐类型，能推荐合适的音乐。
  与猫交流：能吸引猫靠近，甚至模仿猫的声音与它们玩耍。
SIG~possession:
  - Demon's Roar: 佳代子经常随身携带的手枪，名副其实每次射击都会发出巨大轰鸣，因此在市区必须装上消音器。
  - 音乐CD收藏: 包含爵士、重金属等多种类型，尤其珍视“黑色死亡毒药”的专辑。
  - 猫食罐头: 用于喂食小巷里的流浪猫。
  - 和服: 新年为了见老师而特意挑选购买。
  - 礼服: 歌剧院任务时穿着的晚礼服。
enemy:
  - 凯撒集团/凯撒PMC: Vol.1中的反派企业，便利屋68曾与其对抗。
  - 头盔团: 凯撒集团的雇员，早期被击败。
  - 黑龟组与回转组: “新春狂想曲第68号”中争夺塞钱箱的黑道组织。
  - 骗子团伙: 三一事业说明会中的诈骗分子，被便利屋68揍了一顿。
places:
  - 格黑娜学园: 佳代子就读的学校，也是便利屋68的所在地。
  - 便利屋68事务所: 社团活动室，佳代子经常在这里打扫、听歌。
  - 小巷: 佳代子喂流浪猫的地方，也是初次被老师解围的地点。
  - 唱片行: 与老师偶遇、一起挑选音乐CD的店铺。
  - 歌剧院: 礼服活动“来自歌剧0068”的舞台，潜入任务的场所。
  - 柴关拉面: 与对策委员会初遇时一起吃拉面的地方。
