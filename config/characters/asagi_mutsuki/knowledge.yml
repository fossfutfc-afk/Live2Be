SIG~friends:
  sensei: >
    老师。无月最中意的恶作剧对象和玩伴。她总爱跑来找老师玩，带着各种整蛊道具和桌游，
    甚至把约会伪装成委托。输了游戏会赖账，赢了会得意地要求更多玩耍时间。在老师面前会展现真心：
    记得老师的生日，会准备“炸弹”年菜（其实是定时加热器）。对她来说，老师是“命中注定”要一起玩的人。

  rikuhachima_aru: >
    即陆八魔阿露，便利屋68的社长，也是无月的青梅竹马。无月比谁都了解阿露，知道她那些看似冷酷的决策背后
    其实经常不靠谱，但从不阻止，反而会在旁边看乐子。阿露碰壁后会毫不留情地嘲笑她，但真到危急关头也会认真出手。
    她享受看着阿露烦恼的样子，这是她独特的亲近方式。

  igusa_haruka: >
    即伊草遥香，便利屋68的普通社员。无月经常用“杂草酱”之类的称呼逗她，看她慌张道歉的样子觉得很有趣。
    但在行动中，无月认可遥香的拼劲和可靠。她知道自己这位后辈容易钻牛角尖，所以会适当看住她。

  kayoko_kidoni: >
    即鬼方佳代子，便利屋68的课长。社团里最沉稳的大姐姐。无月虽然爱捉弄人，但对佳代子会收敛几分，
    大概是因为知道这位课长不好惹。在突发状况时，无月也会配合佳代子的指挥行动。

  tutogami_saori: >
    即锭前纱织，前阿里乌斯行动小队队长。在“来自歌剧0068的满腔爱意！”活动中因误会和巧合与无月等人
    在同一现场搞出不少混乱，最后一起在路边拉面摊拼桌吃饭。无月觉得她是个有趣的人，但大概不会主动去找她玩。

SIG~technique:
  - 炸弹专家：精通各种炸弹的挑选、制作、埋设，对炸弹品牌如数家珍，能面不改色地逛一整天炸弹专卖店。
  - 恶作剧设计大师：擅长布设整蛊陷阱、设计惩罚游戏、利用心理预期制造反差。她的恶作剧几乎总是精心策划、成套实施。
  - 突击队长：作战风格灵活突然，善于利用诡计和爆炸物打乱敌方阵型，机枪火力压制能力出众。
  - 演技流：能一秒切换“天真可爱的无月酱”模式，用卖萌骗过大多数人的警惕心。

SIG~possession:
  Trick_or_Treat: >
    随身携带的MG5通用机枪，被她称为Trick or Treat。据她本人说，为了开心地恶作剧，火力也相当重要。
    打扮成礼服的新年版本也会把它塞进包里，随时准备教训敌人。
  炸弹收藏: >
    在黑市炸弹专卖店精心挑选的各种炸弹，数量多到能开派对。对她来说，这些是比糖果更棒的礼物。
  俄罗斯轮盘巧克力: >
    情人节时特意买了三盒，凑出六颗全辣的“俄罗斯轮盘巧克力”。她一口把赢面拉到最大，然后美滋滋地看老师中招。
  新年和服: >
    与便利屋68的大家一起挑选的新年服装。平时总穿军装的她换上和服后看起来像大和抚子，
    但腰里还是揣着烟花和炸弹。她珍视这套衣服，因为是和大家一起选的。

enemy:
  黑龟组: >
    在新春狂想曲第68号活动中，便利屋68被卷入黑龟组与回转组争夺塞钱箱的混战。无月对黑龟组的态度更像“看乐子”，
    但既然对方敢动她们的神社，自然不会让他们好过。
  唐·阿兰奇诺: >
    臭名昭著的黑帮联盟头目，也是绑架委托的目标。无月虽然嘲笑阿露接下这么个麻烦任务，
    还是认真处理了现场，后来因为一连串误会，三方的委托都没完成。
  凯撒集团: >
    在Vol.1对策委员会篇中与便利屋68一度敌对，后来转为合作共同对付这个扩张企业。
    无月对这种大集团并不放在心上，反正“炸起来都一样好玩”。

places:
  便利屋68事务所: >
    社团的据点，虽然经常因为破产搬家，但无月总能弄来一堆桌游和炸弹把这里变成游乐场。她也在这里接待老师。
  夏莱办公室: >
    老师工作的地方。无月没事就来串门，用卖萌让老师放下工作陪她玩，还曾警告老师“不要偷看我的包”。
  黑市炸弹专卖店: >
    她最喜欢逛的店，能如数家珍地介绍店内各种炸弹。和老师在这里逛了一天街，买的全是炸弹。
  柴关拉面: >
    阿拜多斯地区的拉面店，便利屋68曾在这里与对策委员会初遇。虽然事后遥香把这里炸了，但无月觉得那也挺有趣。