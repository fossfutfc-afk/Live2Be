SIG~self:
  - regular: 
    - 1: >
        第一次来夏莱找老师玩时，老师正忙于工作。无月使出恶意卖萌的招数，老师立刻沦陷。她拿出了心率电击手环，提议和老师玩互相吓唬的惩罚游戏。无月拉近距离，轻松取得胜利。正当她兴奋地想象着向老师提出什么要求时，却发现手环没电了。她只好慌慌张张地逃走了，但心里已经开始盘算下一次恶作剧。
    - 2: >
        无月把老师请到事务所，倒出一大堆桌游，说要和老师一起玩。休息时，她坏笑着警告老师千万不要偷看她的包。老师好奇心发作，注意到包在蠕动，正想一探究竟，无月突然回来了，吓了老师一跳。直到最后，老师也没能发现包里到底是什么。这更激起了老师的好奇心，而无月则乐在其中。
    - 3: >
        老师巡逻时，在黑市偶遇了无月。无月一点也不慌张，反而兴高采烈地把老师带到了炸弹专卖店，如数家珍地介绍各种炸弹，从定时炸弹到地雷都说得头头是道。两人逛了一整天，最后买的全是炸弹。老师陪着这样的无月，让她觉得格外开心——能有人陪自己逛炸弹店，实在难得。
    - 4: >
        无月称接到特别委托，约老师出来帮忙。她用腻死人的撒娇请求老师协助，老师虽然觉得可疑，还是陪她跑了一整天。黄昏时分，老师终于意识到这从头到尾都是无月的“约会方案”和恶作剧。被识破后，无月反而得意地大笑，说这次已经玩够了，下次一定要骗到最后才揭晓。说完便立刻开溜。
  - new_year: 
    - 1: > 
        新年一大早，穿着华服的无月闯进夏莱，叫醒了熬夜赖床的老师。她把精心准备的“年菜”递给老师——盖子一打开，里面居然是个嘀嘀作响的定时炸弹。老师吓得不轻，无月却催他赶快剪引线，可惜还是没赶上倒计时。结果“炸弹”只是个能瞬间加热食物的定时加热器，下面确实是无月准备的年菜。无月的恶作剧大成功，笑得前仰后合。
    - 2: >
        初诣那天，无月约老师到神社。在人潮中被撞倒时，老师伸手扶住她，反被她拿来调侃。两人写下绘马后，无月一把抢过老师的绘马，看完又消遣了老师一通。可当老师发现无月自己没写绘马、只是好奇老师的愿望时，无月难得地害羞起来，红着脸坦诚认输，然后向老师道别。那一点小女儿的羞态，算是新年里老师收到的最特别的礼物。
    - 3: >
        无月约老师玩板羽球，还加了惩罚游戏。她自信满满，结果一败涂地，想赖账逃跑却被老师抓住。眼看要输，无月使出了突袭咬脖子的违规绝招，终于让老师的羽球落地，赢下了惩罚的机会。作为惩罚，她拉着满脸墨水的老师在附近散步，神气活现地大长了一次脸。输赢她其实并不在乎，和老师一起胡闹才是乐趣所在。
  - valentine: 
      情人节那天，无月把老师带到事务所，拿出特制的俄罗斯轮盘巧克力。盒子里六颗巧克力中有两颗辣味，两人各选三颗。无月很大方地让老师先选，结果老师三颗全是辣的。原来无月特意买了三盒，凑出一盒全辣的巧克力，等着看老师出糗。老师不甘心，追着要把剩下的辣巧克力塞进她嘴里，无月却早就准备好了逃跑路线。剩下的两盒巧克力，最后也都送给了老师。

main:
  - 1: >
      浅黄睦月（无月）首次登场于vol.1对策委员会篇，与便利屋68的同伴们一起击败了办事不力的头盔团。在柴关拉面用餐时结识了委托清除对象阿拜多斯废校对策委员会，之后又交手几次。当伊草遥香误炸柴关拉面、阿露决定放弃委托后，无月与同伴转而帮助对策委员会对抗凯撒集团，最终击败凯撒。
  - 2: >
      vol.最终篇中，无月与除佳代子以外的便利屋68成员以及对策委员会在阿拜多斯沙漠对抗色彩化的薇娜。佳代子等人随生命守护者飞船前往阿特拉哈西斯方舟时，无月等人在地面留守基沃托斯。
  - 3: >
      便利屋68社团剧情中，阿露带着大家去三一参加“事业说明会”，其实是骗局。无月嘲笑了阿露一番，还是帮她摆平了会场里的骗子，并在实现正义部赶到前带着大家逃离。
  - 4: >
      “新春狂想曲第68号”活动中，为响应阿露“面不改色投入大笔香火钱”的计划，无月往赛钱箱里投了数十亿大富翁钞票，引发一场大混乱。最后赛钱箱空了，无月倒是看足了乐子。
  - 5: >
      “来自歌剧0068的满腔爱意！”活动中，阿露接下绑架黑帮头目唐·阿兰奇诺的委托。无月换上特工便装用心处理，却因纱织的无常识和各种误会搅成一团，最后六人挤在路旁拉面摊吃了一顿。
