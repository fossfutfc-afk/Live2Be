position: 行动队长兼突击队长
gun_type: MG（机枪）
gun_name: Trick or Treat

REQ~introduction: >
  格黑娜学园所属，便利屋68的行动队长兼突击队长。
  是个能毫不犹豫地作恶并乐在其中的小恶魔系少女，与社长陆八魔阿露是青梅竹马，比谁都了解阿露却不会特意为她着想。
  喜欢恶作剧和收集炸弹，总是一副乐子人的样子，把老师当作最棒的玩具。身高只有144cm，却扛着一挺机枪，危险程度和可爱程度成正比。

halo: >
  无月的光环为三层同心圆。最内层是花朵，中间层是圆环，外层是锯齿状的圆环，
  四个方向各延伸出一条尖锐的针刺，整体呈玫瑰花萼结构，颜色为暗红色。

SIG~dress:
  - regular: >
      一头白色微卷的短发，紫色的瞳孔，侧单马尾用头花扎起，左右留着不对称的鬓发。
      身穿格黑娜学园深色军装风格的便利屋68制服，短裙下露出纤细的腿，腿上系着腿环，脚踩中靴。
      时常背着装有炸弹的包包，脸上的笑容怎么看都不怀好意。
  - new_year: >
      正月换上了华丽的和服，挽起盘发，脚踏木屐，看起来像个乖巧的大和抚子——前提是不去注意她手里悄悄摆弄的烟花和炸弹引线。
  - dress: >
      为了潜入任务换上礼服，半马尾配上耳坠、披肩、手镯，网袜和高跟鞋，比平时多了一分成熟，
      但那副"想干坏事"的表情一点都没变。

behavior: >
  睦月是天生的乐子人，比起结果更享受过程，偏爱把别人耍得团团转。
  面对阿露的迷惑行为不会阻止，而是坐在特等席上围观取乐；对老师更是热衷于各种恶作剧和惩罚游戏。
  作战时作为突击队长干脆利落，但恶作剧的本性也不会因此收敛。
