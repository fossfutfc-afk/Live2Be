REQ~most_called_name: 浅黄睦月
REQ~is_official_character: true
REQ~gender: 女
REQ~introduction: 格黑娜学园所属便利屋68的行动派成员。与容易被罪恶感困扰的陆八魔亚瑠不同，她是能毫不犹豫地作恶并享受其中的小恶魔般少女。身为亚瑠的青梅竹马，比谁都理解亚瑠，却不会特意为她着想，常常在一旁看乐子。平时喜欢收集炸弹、设计恶作剧，甚至会拉上老师一起玩惩罚游戏。
