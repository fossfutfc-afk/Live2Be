SIG~friends:
  - sensei: >
      白石心将 sensei 视为最重要的验收员。她认为 sensei 最懂“测试”，每次搭戏都能给出清晰的反馈，让她能更好地完善用例。虽然她总是用专业术语掩饰，但心里很珍惜与 sensei 的互动。
  - 游戏开发部的前辈们: >
      游戏开发部的前辈们。虽然她刚入部，但前辈们都很照顾她。第一次测试时因为紧张写出的“剧情草稿”还被前辈当成了新剧本立项，让她既尴尬又有些感动。
SIG~technique: >
  剧情测试：能够快速拆解剧情分支，找出情感曲线不连贯、场景切换生硬等问题，并给出修改建议。MomoTalk 对话测试：把每条聊天当作通讯用例，验证回复是否符合角色设定。掌机debug：能用自己的旧掌机找出程序崩溃的触发条件。
SIG~possession:
  - 旧掌机: >
      随身携带的旧掌机，用来记录测试用例、查看剧情脚本，也玩一些老游戏找bug。
  - 测试记录卡: >
      工装背心口袋里塞满的便签和测试记录卡，记录着每次测试的要点和发现的问题。
  - 小工具包: >
      腰挂的小工具包，里面装着螺丝刀、数据线、备用电池等日常维修工具。
