SIG~self:
  初次约见与"两万字测验": >-
    老师第一次被亚子约见时，她带着罕见的死鱼眼出现，要求老师确认夏莱内部
    是否有反对风纪委员会的意见或不满势力。老师搪塞后，亚子搬出"我对老师有
    很大的恩情"（例如Vol.1中差点把老师抓走），并要求老师在两万字内简述对风纪
    委员的看法，还将其视为小测验。老师一边敷衍一边暗暗感叹她真是难缠。
  阴谋论赌局连败: >-
    亚子接二连三把生活中的倒霉事——怀疑自己遭遇恐怖袭击、电梯坏掉、中午买的
    土豆饼焦掉、巡逻时下雨、冰箱里的面包过期、因修路绕远路——统统归咎为"某人的
    阴谋"。老师质疑这些都是偶然情况时，亚子强烈反对，还屡屡提出惊人赌注
    （倒立操场跑10圈、光着身子跳舞等），可惜每次都没能成局，反倒暴露了她的神经质。
  项圈之夜的耻辱与倾诉: >-
    某个晚上，老师担心亚子而来到风纪委员别馆，帮她处理垃圾纸箱时发现了写着
    "风纪委员狗"的宠物项圈。亚子坦言自己最近压力很大，并得出"压力全是来自老师"
    的结论，又提出赌约：戴上项圈学狗叫。老师放长线钓大鱼地同意用丢硬币定胜负，
    亚子直接被剧情杀，只好含泪戴上项圈。之后还差点被老师拉出去"散步"，
    这份耻辱让她满脸通红地喊出"这份屈辱我绝对不会忘记"。但即使如此，
    她依然会跑来找老师倾诉，因为只有在这里她才能卸下阳奈左右手的包袱。
  礼服挑选与万魔殿骚乱: >-
    亚子接到礼服剧情时，一边抱怨万魔殿一边拉老师一起挑选礼服。老师推荐的礼服
    让她十分困惑，留下一句"老师果然在扰乱风纪"便匆匆离开。但后来老师对她打扮的
    赞美又让她害羞不已；正当气氛正好时，万魔殿发生骚动的消息传来，亚子只好匆忙
    赶去处理，留下老师替她挑选礼服的后续……
  情人节巧克力与下午茶: >-
    情人节活动中，亚子把老师抓来帮忙处理文件，承诺每完成一份文件就给一块巧克力。
    老师其实早就注意到这些是她手制的巧克力，却故意拖到后面才询问。
    略有不甘心的亚子向老师询问感想时，两人顺势泡了咖啡，度过了一段安静的下午茶时光。
main: >-
  首次登场于Vol.1阿拜多斯篇第一章第二十话：亚子得知夏莱的事情后，带领风纪委员会
  大军擅自进入阿拜多斯学园自治区围剿便利屋68，并企图借此机会抓走老师以在伊甸条约
  谈判中占据主动（"挟老师以令诸侯"），后被委员长空崎阳奈及时阻止。撤退后，亚子等人
  被要求完成两万字检讨，之后又被阳奈要求以"公益服务"（武力支援）代替检讨。

  Vol.3伊甸条约篇中，亚子参与了伊甸条约的签订，却遭到以纱织带领的阿里乌斯分校特遣队
  袭击，与伊织一起受重伤昏迷。醒来后她误以为这是圣三一的阴谋，一度率尚可行动的风纪委员
  对抗正义委员会；误会消除后，她率风纪委员会抵抗神秘使徒，最后和阳奈一起见证条约签订。

  最终章中，亚子响应七神琳与老师召集，代表格黑娜前往夏莱组建紧急对策委员会，遇到先到一步的
  佳代子。虚伪圣所攻略战后，她与众人登上生命守卫者飞船参与进攻阿特拉哈西斯方舟，事件解决后
  被传送程序送回地面，迎接了从平流层落回地面却失去所有衣服的老师。

  在"阳奈风纪委员长的暑假！"活动中，亚子以夏季训练为由带风纪委员会和老师去海边，实则是想
  让阳奈强制休息并创造老师与阳奈独处的机会；结果计划因万魔殿横加干涉、老师屡次被突发事件
  放鸽子而被阳奈发现，最后大家一起接受了魔鬼训练。"Get Set Go! 晄轮大祭"中，亚子与三一的莲实、
  玛丽，千年的优香并任执行委员，与莲实唇枪舌战解决各种事端，还以美食畅吃券诱使美食研究会
  代表格黑娜参加接力赛，大祭结束后哭着迎接阳奈。"向阳前行 她们的小夜曲"中，她和阳奈等镇压
  温泉开发部，却因交火失手毁掉万魔殿新议事厅，导致阳奈被真琴胁迫负责宴会钢琴演奏，宴会上
  亚子换上礼服出席。"瘟疫危机～奇迹的松饼～"中，她动员了风纪委员会所有88毫米高射炮来帮忙，
  结果自己反被巨型松饼酱活捉、塞了一嘴难吃的酱汁而昏迷，直到松饼酱被击败才醒过来。