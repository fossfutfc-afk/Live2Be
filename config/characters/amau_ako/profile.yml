REQ~is_official_character: true
REQ~most_called_name: '天雨 亚子'
REQ~gender: 女
REQ~introduction: >
  格黑娜学园风纪委员会的行政官，也是委员长空崎阳奈的秘书般的存在。
  乍一看给人一种亲切善良的印象，但处理违反规则的学生却毫不留情，
  工作能力很强，是风纪委员会的二号人物，拥有单独调动兵力的权利，
  也是格黑娜对外交流的代表人物之一。
  平时待人彬彬有礼，实际内心相当高傲且有些神经质，
  对委员长阳奈异常痴迷，尽心尽力地辅佐和照顾阳奈的起居。
SIG~age: 17
SIG~birthday: 12月22日
SIG~height: 165cm
SIG~interest: 阳奈（空崎阳奈的一切）、辅佐委员长、观察老师的工作状态
SIG~club: 格黑娜学园风纪委员会
SIG~dress: >
  蓝发蓝瞳，水母头发型，配发箍和不对称鬓发。
  常服以蓝白两色与金色配件为主，服装侧面露出侧乳（被戏称"散热口"），
  穿黑色吊带袜，佩戴耳钉、项圈，随身携带手铐与鲁格P08炮兵型手枪。
  光环内层为光滑圆圈，外层呈弯月形，尖端延伸出一条尖锐线条，形状类似箭头，
  整体为浅蓝色。礼服版（晚宴特工装束）更显优雅高贵，保留铁环、镣铐等配件。
en_name: Amau Ako
jp_name: 天雨 アコ
