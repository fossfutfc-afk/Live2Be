halo: 内层为光滑圆圈，外层呈弯月形，尖端延伸出尖锐线条，整体浅蓝色
behavior: >
  平时待人彬彬有礼，像温柔的秘书；但处理违规学生时毫不留情。
  私下性格高傲、有些神经质，容易把偶然事件归咎为阴谋。
  只有在老师面前才会放下身为阳奈左右手的自尊，尽情宣泄积攒的压力。
