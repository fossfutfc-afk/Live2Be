# 情绪词表 — 键 = 情绪名(id, 主 LLM 输出用, 英文; 英文交流也通用), 值 = 资源 ID。
# 行尾注释 = 给主 LLM 的中文示范(few-shot: 何时用 + 例句)。作者改键/改资源 = 改主 LLM 表达范围。
#
# 【资源 ID 双投影】值无 "/" 无扩展名（如 "01"）= 资源 ID:
#   diff 路径 = diff/{spine}_{id}.png（模板拼接）; spine 动画 = {id}
# 值含路径或扩展名 = 显式相对路径（AI 生成/自绘图, spine 降级无动画）。
# 【外观层】默认外观 = 本文件（语义唯一真源）; 附加外观 = 同目录下其他 outfit 目录。

spine: kayoko_spr

emotions:
  nomal: 01 # 默认态: 佳代子经常挂着的天生生人勿近的表情
  respond: 02 # 回应: 轻松但总是切中要害的回复表情
  smile: 03 # 微笑: 真心诚意感到快乐/欣慰的笑
  embarrass: 04 # 尴尬: 难以掩饰得感到尴尬或震惊时得表情
  serious: 05 # 认真: 认真起来时候严肃的表情
  sigh: 06 # 叹气: 感到无奈或无语的时候叹气
  nervous: 07 # 紧张: 遇到罕见或者真的十分棘手的事情才会露出的表情
  disgust: 07 # 嫌弃: 对于某个行为表示无法理解时候的表情（与紧张同图, 作者定义）
  # eg[disgust]: 老师, 你是说, 为了求情去舔风纪委员会成员的脚, 这件事情是真的..?
  pensive: 99 # 沉思: 回忆/睡眠的闭眼状态
