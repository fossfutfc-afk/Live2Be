# 附加外观模板 — 复制本文件为 {外观id}.yml 即注册一个新外观。
# 位置: assets/illustration/{char}/outfits/{outfit_id}.yml
#
# 规则:
#   - 本文件层级恒为 1（无嵌套）——label/spine/body/emotions 平铺
#   - emotions 键必须 ⊆ 主文件（emotions.yml）的键; 超出 → 校验警告（宁缺勿错）
#   - 未写键 = 该外观无此情绪的图 → 渲染端静默保持上一张
#   - 值 = 资源 ID（双投影, 同主文件）:
#       官方资产（有模板）: 写序号 "01" → diff 路径 + spine 动画自动派生
#       AI 生成/自绘: 写显式路径 "custom/nomal.png" → 纯静态图, 无 spine
#
# 作者必填:
#   label: 人类可读名（喂 LLM 的服装词表用, 如 "新年装" / "我的风格"）
#
# 可选:
#   spine: 该外观的表情 spine 包（= spine/ 下目录名; 缺省 = 无 spine, 纯静态图）
#   body:  M4 双包预留: 身体包（缺省 = 无）
#   diff_dir: 该外观的静态图目录（缺省 "diff"——模板前缀 = diff/{spine}_{id}.png 需要）

label: 新年装
# spine: aru_newyear_spr
# body: Aru_newyear_home
emotions:
  nomal: 01
  # smile: 03
  # embarrass: 04
  # custom: custom/my_own.png     ← 自绘图示例（路径随意）
