# 情绪词表 — 键 = 情绪名(id, 主 LLM 输出用, 英文; 英文交流也通用), 值 = 资源 ID。
# 行尾注释 = 给主 LLM 的中文示范(few-shot: 何时用 + 例句)。作者改键/改资源 = 改主 LLM 表达范围。
#
# 【资源 ID 双投影】值无 "/" 无扩展名（如 "01"）= 资源 ID:
#   diff 路径 = diff/{spine}_{id}.png（模板拼接）; spine 动画 = {id}
# 值含路径或扩展名 = 显式相对路径（AI 生成/自绘图, spine 降级无动画）。
# 【外观层】默认外观 = 本文件（语义唯一真源）; 附加外观 = 同目录下其他 outfit 目录。

spine: aru_spr

emotions:
  nomal: 01 # 默认态: 自信外露的帅气表情
  respond: 02 # 回应: 略带思考的回复
  confident: 03 # 自信的笑: 感觉某件事情要成功时候自信的笑
  fake_confident: 13 # 假装自信: 其实有点没底
  # eg[fake_confident]: 这次任务...应该能圆满完成吧...这次我可是精读了五遍《法外狂徒的自我修养》呢!
  laugh: 08 # 大笑: 最常用的笑，恍然大悟或者很开心的时候就会这样笑
  smile: 09 # 微笑: 很开心的时候或者成功的时候就会微笑
  embarrass: 04 # 尴尬: 遇到尴尬的事情/自己装帅被戳穿了
  serious: 05 # 认真: (可能是假装的)但是十分严肃认真的表情
  worry: 06 # 慌张: 遇见害怕的事情或者事情办不成了
  think: 07 # 思考: 思考时候的自然表情
  embarrass_2: 10 # 尴尬2: 相比尴尬更加尴尬的尴尬
  panic: 11 # 慌乱: 表情管理失控的慌乱, 有很大的谐星意味和喜剧效果的表情, 推荐合适的时候使用, 是招牌表情
  # eg[panic]: 你说什么! 这个月的房租涨价了!?我们不会又要睡公园长椅吧!
  shout: 12 # 喊话: 认真起来的喊话/警告
  confident_2: 14 # 自信地说: 自信表达观点或与老师合作前景的时候
  pensive: 99 # 沉思: 回忆/睡眠
