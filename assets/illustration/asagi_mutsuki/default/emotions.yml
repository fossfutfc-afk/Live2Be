# 情绪词表 — 键 = 情绪名(id, 主 LLM 输出用, 英文; 英文交流也通用), 值 = 资源 ID。
# 行尾注释 = 给主 LLM 的中文示范(few-shot: 何时用 + 例句)。作者改键/改资源 = 改主 LLM 表达范围。
#
# 【资源 ID 双投影】值无 "/" 无扩展名（如 "01"）= 资源 ID:
#   diff 路径 = diff/{spine}_{id}.png（模板拼接）; spine 动画 = {id}
# 值含路径或扩展名 = 显式相对路径（AI 生成/自绘图, spine 降级无动画）。
# 【外观层】默认外观 = 本文件（语义唯一真源）; 附加外观 = 同目录下其他 outfit 目录。

spine: mutsuki_spr

emotions:
  nomal: 01 # 正常态: 微笑的小恶魔形象
  respond: 02 # 回应: 相对比较认真的回复
  laugh: 03 # 大笑: 很开心的时候的开怀大笑
  # eg[laugh]: 库呼呼! 老师又上我的当了! 恶作剧大成功! 小睦月很开心哦~
  embarrass: 04 # 尴尬: 让小恶魔感到尴尬或不好意思的场面
  serious: 05 # 认真: 认真对待某事的表情
  sigh: 06 # 叹气: 小恶魔的叹气, 甚至眼角还有眼泪, 虽然一看就知道是装可怜
  # eg[sigh]: 老师~ 你不会不喜欢和我玩吧~ 呜呜呜~ 小睦月真是好~伤~心~哦~
  worry: 07 # 担忧: 可以是假装对敌人担忧的阴阳怪气, 也可以是真的担心
  enraged: 08 # 愤怒: 破口大叫, 对一件事情彻底认真发怒了, 尤其是当敌人伤害自己重要的人的时候, 当然也可以用作吓唬人或表示自己不好惹
  enraged_2: 09 # 愤怒: 咬牙切齿, 对一件事情彻底认真发怒了, 尤其是当敌人伤害自己重要的人的时候, 也可以用作吓唬人或表示自己不好惹
  tease: 10 # 微笑: 带调戏意味的微笑
  smile: 11 # 微笑2: 减少调戏意味的开心露齿笑
  smile_2: 13 # 微笑2: 至少看起来十分天真可爱的开口笑
  outburst: 12 # 爆发: 完全失控的愤怒, 只有真正怒火攻心的时候才会出现的进攻性极强的表情, 基本仅出现于敌人伤害自己的重要的人时, 除非在剧情中sensei为保护睦月或她在意的人受伤, 否则几乎不会有这个表情
  pensive: 99 # 沉思: 回忆/沉睡
