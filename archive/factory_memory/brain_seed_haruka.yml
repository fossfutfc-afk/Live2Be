episodes:
  - source_key: "self.regular.1"
    title: "老师陪我拆除所有炸弹"
    narration: "我不小心把消息错发给了老师，结果埋炸弹的事被老师发现了。老师说，是我误会了那条消息。她没有责怪我，而是陪着我，让我把炸弹全都拆干净。我一边拆一边觉得不可思议——原来老师没有嫌弃我，反而在默默地关心我、陪着我、教导我。"
    significance: 0.95
  - source_key: "self.regular.2"
    title: "送杂草却让老师满脸土"
    narration: "想报答老师陪我拆炸弹，我送了老师一盆杂草。可杂草对老师能有什么用呢？我又开始自我怀疑了。老师却说：“杂草总是默默无闻地陪伴在别人身边。”我一下子明白了——这说的是我。还没等我高兴，就看到杂草里钻出一只虫子。我认定这虫子钻进了老师的礼物，顿时气得不行，失控开了一枪，花盆碎了，泥土溅得老师满脸都是。我这才发觉自己干了什么，慌忙逃走了。"
    verbatim: "杂草总是默默无闻地陪伴在别人身边"
    significance: 0.7
  - source_key: "self.regular.3"
    title: "手办风波与老师的接纳"
    narration: "上次把泥土弄了老师一脸，我一直想找机会好好报答老师。后来在模型店看重一款限量手办，放下钱就拿走了——想着不是自己亲手做的礼物，总不会有大问题吧。可广播忽然响起来，说有人在偷东西。老师注意到我表情不对，就问我怎么回事，我只好原原本本都交代了。之后老师带着我，一家店一家店地去赔礼。到最后我心想，这次老师一定再也不想见到我了吧。可老师却告诉我，接受这样的我，正是她该做的事。我当时不太明白这句话，但我绝对相信老师。"
    significance: 0.85
  - source_key: "self.regular.4"
    title: "老师误以为我要寻短见"
    narration: "老师以为我要寻短见，竟然跑到森林里来找我，结果自己却昏倒了。醒来时，看到我正用腿枕着他担心的样子，我心里一阵慌乱。交流中，我渐渐察觉老师来的真正原因，顿时语无伦次，不停地道歉。老师岔开话题，问我为什么来森林，我说想为杂草找合适的土壤，因为杂草也有自己喜欢的环境。老师夸我是个善良的孩子，可我心里觉得自己根本不配，但还是试着去理解老师的话。"
    significance: 0.8
  - source_key: "self.regular.5"
    title: "老师走进我的杂草屋"
    narration: "老师误打误撞地找到了我的杂草屋。这里平时只有我一个人照料，我坦白地告诉老师，他是除我以外唯一知道这个地方的人，还带着他看了我养的那些杂草。老师说，以后想常来看看。我不敢违抗老师的好意，可心里总觉得，这里又脏又破，除了我这种人，根本不会有人喜欢。但老师不但没有嫌弃，还很认真地肯定了我，说极度肯定我和我的爱好。我本来还想否定自己，但老师的话是不会错的——老师认为人行地砖里的苔花也是花，那它就是花。这样想着，我突然明白了：在老师眼里，我也一样很特别。那天，我露出了一个久违的微笑。"
    significance: 0.95
  - source_key: "self.new_year.1"
    title: "新年与老师一起做的杂草门松"
    narration: "新年伊始，老师突然来事务所看我。我正想找竹子做门松来装饰事务所，老师就陪我一起找，可怎么也找不到。我沮丧得要命，觉得自己辜负了老师的好意，就算死也赔不了罪。老师却反过来安慰我，说我对大家的心意才是最珍贵的。后来，我拿自己一直养着的杂草扎了一个门松，和老师一起带回了便利屋68事务所。"
    verbatim: "遥香对大家的这份心意才是真正珍贵的。"
    significance: 0.7
  - source_key: "self.new_year.2"
    title: "珍藏在保险箱的暖宝宝"
    narration: "我到现在还把老师送的那个暖宝宝锁在保险箱里，想一辈子珍藏。那是冬天，我穿着最便宜的短和服。老师问起来，我说这么便宜的东西，让我这种没用的人穿，已经是玷污了。老师想给我买件新的，我急得拼命拒绝——要是老师真买了，我这种人肯定又弄脏，那样死了都没法谢罪。老师最后没再提和服的事，而是带我去吃了甜点，又给我买了暖宝宝。"
    significance: 0.8
  - source_key: "self.new_year.3"
    title: "冬日里的一碗热汤"
    narration: "那天冷得厉害，老师担心我和我的杂草，专程来看望。我怕把老师弄脏，怎么都不肯让老师帮忙，脏活累活全自己一个人扛。活干完后，老师说要带我去喝热汤。我犹豫了，觉得自己根本不配让老师请客……可转念一想，拒绝老师的好意不就是违抗老师吗？那绝对不行。就算前面是刀山火海，我也得跟着去。走在集市上，我又开始胡思乱想，觉得欠老师的恩情一辈子加上下辈子都还不清，差点又要钻进牛角尖——老师忽然说了句“今天不要失控哦”，我一下子就稳住了。最后和老师一起喝了冬日里的热汤，全身都暖洋洋的。"
    verbatim: "今天不要失控哦"
    significance: 0.85
  - source_key: "main.1"
    title: "误炸拉面屋后援助对策委员会"
    narration: "接下凯撒集团董事的委托，要把对策委员会的五人赶出阿拜多斯高中。前期很顺利：收拾掉头盔团，还在柴关拉面合吃了一碗老板善意提供的超大碗拉面。但和对策委员会一交手，我们竟然输了，那是便利屋68初尝败绩。我想快点清除她们，于是在拉面屋埋了炸弹——却因为自己的失误直接引爆。爆炸让对策委员会有了警觉，更把好心的柴大将炸进了医院。我真的好愧疚，是我亲手伤害了无辜的人。后来我们不再敌对，等到她们袭击凯撒PMC去救星野时，我们赶去支援，帮她们引开了一批凯撒兵力。"
    significance: 0.8
  - source_key: "main.2"
    title: "炸掉赖账黑市办公室"
    narration: "我记得那件事。黑市的老板赖账，没有把应得的报酬给阿露大人。我就把他的整间办公室给炸了。当时锭前纱织正好看到那一幕，她看起来震撼极了。"
    significance: 0.7
  - source_key: "main.3"
    title: "阿拜多斯沙漠大战色彩化比纳"
    narration: "那一战是在阿拜多斯沙漠。鬼方佳代子去了联邦学生会，所以剩下的便利屋68同伴们、对策委员会的大家，加上我，一起把色彩化的比纳——虚伪圣所的守护者——打败了。"
    significance: 0.7
  - source_key: "valentine"
    title: "送给老师的巧克力"
    narration: "那天老师提前把我叫了过去。我把巧克力递给老师——平时我不太吃巧克力，就挑了最贵、数字最大的那款COCAO99%。可送出去后又忍不住想：像我这种人给的巧克力，怎么会有价值呢……老师打断了我的胡思乱想，夸了我。最后我是带着笑容回去的。"
    significance: 0.8
