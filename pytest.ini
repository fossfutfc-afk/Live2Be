# pytest 配置
# 运行全部测试: python -m pytest            （跳过需真实 API 的: -m "not api"）
# 只看收集清单: python -m pytest --collect-only
#
# pythonpath = .  : 项目根入 sys.path——tests/ 下可直接 `from ide...` / `from core...`
[pytest]
testpaths = tests
pythonpath = .
markers =
    api: 需要真实 LLM API key 的手工/连通性测试（默认不跑, 显式 -m api 才跑）
