<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live2Be</title>
<link rel="stylesheet" href="/static/css/gui.css">
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/settings.css">
<link rel="stylesheet" href="/static/css/mmt.css">
</head>
<body>
<!-- menu 背景轮播层（BA 大版本图按序播放, 淡入淡出） -->
<div id="bg-layer" aria-hidden="true"></div>
<div id="bg-dim" aria-hidden="true"></div>

<main id="app" class="login">
  <!-- 登录视图 -->
  <section id="view-login">
    <div class="logo-box">
      <img id="logo-img" src="/assets/menu/logo/Live2Be_ba-style@nulla.top.png"
           alt="Live2Be">
    </div>
    <p class="subtitle">基沃托斯的日常，从这里开始</p>

    <!-- 名字输入（页面内面板; 彩蛋才弹窗） -->
    <div id="panel-name" class="panel">
      <p id="welcome-line" class="hint hidden"></p>
      <p class="hint">你希望学生们怎么称呼你？（留空 = sensei）</p>
      <div class="row">
        <input id="input-name" type="text" maxlength="32" placeholder="输入名字"
               autocomplete="off">
        <button id="btn-ok">确定</button>
      </div>
      <p id="msg-error" class="error hidden"></p>
    </div>

    <!-- 彩蛋展示（普通彩蛋内嵌; ER 系统级彩蛋 → alert 弹窗） -->
    <div id="egg-box" class="egg hidden"></div>
    <button id="btn-enter" class="hidden">进入主界面</button>
  </section>

  <!-- 主界面（M2: 三按钮, 功能未实现） -->
  <section id="view-main" class="main hidden">
    <div id="main-bg" aria-hidden="true"></div>
    <div id="main-dim" aria-hidden="true"></div>
    <div class="main-content">
      <div class="main-logo">
        <img src="/assets/menu/logo/Live2Be_ba-style@nulla.top.png" alt="Live2Be">
      </div>
      <p class="main-name">老师 · <span id="main-name"></span></p>
      <div class="menu-buttons">
        <button class="menu-btn" id="btn-settings">设 置</button>
        <button class="menu-btn primary" id="btn-mmt">手机 MMT</button>
        <button class="menu-btn" id="btn-playback">回 放</button>
      </div>
      <button id="btn-back-login" class="link">返回登录</button>
    </div>
  </section>

  <!-- 设置视图（简略版: settings.toml 存档; 引擎仍读 env） -->
  <section id="view-settings" class="settings hidden">
    <h1 class="logo small">设 置</h1>
    <div class="panel">
      <h3>LLM（对话 / 剧情）</h3>
      <label>API Key <input id="set-llm-key" type="text" placeholder="留空 = 用 .env 的 key"></label>
      <label>Base URL <input id="set-llm-base" type="text" placeholder="https://api.deepseek.com/v1"></label>
      <label>Model <input id="set-llm-model" type="text" placeholder="deepseek-v4-flash"></label>
    </div>
    <div class="panel">
      <h3>生图</h3>
      <label>API Key <input id="set-img-key" type="text" placeholder="留空 = 用 .env 的 key"></label>
      <label>Base URL <input id="set-img-base" type="text" placeholder="https://api.apiyi.com"></label>
      <label>Model <input id="set-img-model" type="text" placeholder="gemini-3.1-flash-lite-image"></label>
    </div>
    <div class="row">
      <button id="btn-save-settings">保 存</button>
      <button id="btn-back-main" class="link">返回主界面</button>
    </div>
    <p id="settings-msg" class="error hidden"></p>
  </section>

  <!-- MMT 界面（M3.5: 顶部横幅 + 左模式栏 + 右侧按模式渲染; 聊天逻辑后写） -->
  <section id="view-mmt" class="mmt hidden">
    <header class="mmt-header">
      <span class="mmt-title">🍑 MomoTalk</span>
      <button id="mmt-back" class="link">返回</button>
    </header>
    <div class="mmt-body">
      <aside class="mmt-mode">
        <button class="mode-btn active" data-mode="profile">资料</button>
        <button class="mode-btn" data-mode="chat">对话</button>
        <!-- 未来: 论坛 -->
      </aside>
      <div class="mmt-main">
        <!-- 资料模式（角色卡: 圆头像+名字+生日+bio+好感; 独立排序） -->
        <div id="mmt-profile" class="mmt-pane">
          <div class="mmt-pane-head">
            <span class="mmt-pane-title">成员资料</span>
            <div class="mmt-sort">
              <button class="sort-btn active" data-sort="affection">好感</button>
              <button class="sort-btn" data-sort="birthday">生日</button>
              <button class="sort-btn" data-sort="name">名字</button>
            </div>
          </div>
          <div class="mmt-list" id="mmt-profile-list"><p class="mmt-loading">加载中…</p></div>
        </div>
        <!-- 对话模式（成员列表 + 聊天窗口） -->
        <div id="mmt-chat" class="mmt-pane hidden">
          <div class="mmt-pane-head">
            <span class="mmt-pane-title">成员</span>
            <div class="mmt-sort">
              <button class="sort-btn active" data-sort="recent">最新</button>
              <button class="sort-btn" data-sort="affection">好感</button>
            </div>
          </div>
          <div class="mmt-chat-body">
            <div class="mmt-list" id="mmt-chat-list"><p class="mmt-loading">加载中…</p></div>
            <div class="mmt-chat-window" id="mmt-chat-window">
              <p class="mmt-empty">请选择成员。</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="/static/js/gui.js"></script>
<script src="/static/js/main.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/mmt.js"></script>
</body>
</html>
