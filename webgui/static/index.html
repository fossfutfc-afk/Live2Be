<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live2Be</title>
<!-- vendor 裸导入映射: pixi.js 官方自包含 ESM bundle（spine-pixi-v8 的 esm bundle
     内联了 spine-core, 唯一外部依赖即 pixi.js; import map 让浏览器无需打包工具链） -->
<script type="importmap">
{
  "imports": {
    "pixi.js": "/static/vendor/pixi.min.mjs"
  }
}
</script>
<link rel="stylesheet" href="/static/css/gui.css">
<link rel="stylesheet" href="/static/css/main.css">
<link rel="stylesheet" href="/static/css/settings.css">
<link rel="stylesheet" href="/static/css/mmt.css">
<link rel="stylesheet" href="/static/css/bond.css">
</head>
<body>
<!-- menu 背景轮播层（BA 大版本图按序播放, 淡入淡出） -->
<div id="bg-layer" aria-hidden="true"></div>
<div id="bg-dim" aria-hidden="true"></div>

<main id="app" class="login">
  <!-- 登录视图 -->
  <section id="view-login">
    <div class="logo-box">
      <img id="logo-img" src="/assets/menu/logo/Live2Be_ba-style@nulla.top.png"
           alt="Live2Be">
    </div>
    <p class="subtitle">基沃托斯的日常，从这里开始</p>

    <!-- 名字输入（页面内面板; 彩蛋才弹窗） -->
    <div id="panel-name" class="panel">
      <p id="welcome-line" class="hint hidden"></p>
      <p class="hint">你希望学生们怎么称呼你？（留空 = sensei）</p>
      <div class="row">
        <input id="input-name" type="text" maxlength="32" placeholder="输入名字"
               autocomplete="off">
        <button id="btn-ok">确定</button>
      </div>
      <p id="msg-error" class="error hidden"></p>
    </div>

    <!-- 彩蛋展示（普通彩蛋内嵌; ER 系统级彩蛋 → alert 弹窗） -->
    <div id="egg-box" class="egg hidden"></div>
    <button id="btn-enter" class="hidden">进入主界面</button>
  </section>

  <!-- 主界面（M2: 三按钮, 功能未实现） -->
  <section id="view-main" class="main hidden">
    <div id="main-bg" aria-hidden="true"></div>
    <div id="main-dim" aria-hidden="true"></div>
    <div class="main-content">
      <div class="main-logo">
        <img src="/assets/menu/logo/Live2Be_ba-style@nulla.top.png" alt="Live2Be">
      </div>
      <p class="main-name">老师 · <span id="main-name"></span></p>
      <div class="menu-buttons">
        <button class="menu-btn" id="btn-settings">设 置</button>
        <button class="menu-btn primary" id="btn-mmt">手机 MMT</button>
        <button class="menu-btn" id="btn-playback">回 放</button>
      </div>
      <button id="btn-back-login" class="link">返回登录</button>
    </div>
  </section>

  <!-- 设置视图（简略版: settings.toml 存档; 引擎仍读 env） -->
  <section id="view-settings" class="settings hidden">
    <h1 class="logo small">设 置</h1>
    <div class="panel">
      <h3>LLM（对话 / 剧情）</h3>
      <label>API Key <input id="set-llm-key" type="password" placeholder="留空 = 用 .env 的 key"></label>
      <label>Base URL <input id="set-llm-base" type="text" placeholder="https://api.deepseek.com/v1"></label>
      <label>Model <input id="set-llm-model" type="text" placeholder="deepseek-v4-flash"></label>
    </div>
    <div class="panel">
      <h3>生图</h3>
      <label>API Key <input id="set-img-key" type="password" placeholder="留空 = 用 .env 的 key"></label>
      <label>Base URL <input id="set-img-base" type="text" placeholder="https://api.apiyi.com"></label>
      <label>Model <input id="set-img-model" type="text" placeholder="gemini-3.1-flash-lite-image"></label>
    </div>
    <div class="row">
      <button id="btn-save-settings">保 存</button>
      <button id="btn-back-main" class="link">返回主界面</button>
    </div>
    <p id="settings-msg" class="error hidden"></p>
  </section>

  <!-- MMT 界面（M3.5: 顶部横幅 + 左模式栏 + 右侧按模式渲染; 聊天逻辑后写） -->
  <section id="view-mmt" class="mmt hidden">
    <header class="mmt-header">
      <span class="mmt-title">🍑 MomoTalk</span>
      <button id="mmt-back" class="link">返回</button>
    </header>
    <div class="mmt-body">
      <aside class="mmt-mode">
        <button class="mode-btn active" data-mode="profile">资料</button>
        <button class="mode-btn" data-mode="chat">对话</button>
        <!-- 未来: 论坛 -->
      </aside>
      <div class="mmt-main">
        <!-- 资料模式（角色卡: 圆头像+名字+生日+bio+好感; 独立排序） -->
        <div id="mmt-profile" class="mmt-pane">
          <div class="mmt-pane-head">
            <span class="mmt-pane-title">成员资料</span>
            <div class="mmt-sort">
              <button class="sort-btn active" data-sort="affection">好感</button>
              <button class="sort-btn" data-sort="birthday">生日</button>
              <button class="sort-btn" data-sort="name">名字</button>
            </div>
          </div>
          <div class="mmt-list" id="mmt-profile-list"><p class="mmt-loading">加载中…</p></div>
        </div>
        <!-- 对话模式（成员列表 + 聊天窗口） -->
        <div id="mmt-chat" class="mmt-pane hidden">
          <div class="mmt-pane-head">
            <span class="mmt-pane-title">成员</span>
            <div class="mmt-sort">
              <button class="sort-btn active" data-sort="recent">最新</button>
              <button class="sort-btn" data-sort="affection">好感</button>
            </div>
          </div>
          <div class="mmt-chat-body">
            <div class="mmt-list" id="mmt-chat-list"><p class="mmt-loading">加载中…</p></div>
            <div class="mmt-chat-window" id="mmt-chat-window">
              <p class="mmt-empty">请选择成员。</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 羁绊剧情 VN 视图（全屏遮罩——在 MMT 之上; 背景 cover + SpinePlayer 立绘
       舞台 + 下部文字区/选项; 结束回 MMT 保留聊天窗状态） -->
  <section id="view-bond" class="bond hidden" aria-label="羁绊剧情">
    <div id="bond-bg" class="bond-bg" aria-hidden="true"></div>
    <div id="bond-shade" class="bond-shade" aria-hidden="true"></div>
    <div id="bond-stage" class="bond-stage" aria-hidden="true"></div>
    <!-- 右上角: 自动 / 菜单 -->
    <div class="bond-topbar">
      <button id="bond-auto" class="bond-topbtn" type="button">自动</button>
      <button id="bond-menubtn" class="bond-topbtn" type="button">菜单</button>
    </div>
    <!-- 下部对话块: 名字牌 → 对话文本(逐字)（底部对齐, 浮在画面上） -->
    <div class="bond-dialogue">
      <div class="bond-nameplate">
        <span id="bond-name" class="bond-name"></span>
        <span id="bond-club" class="bond-club"></span>
      </div>
      <div id="bond-text" class="bond-text"></div>
    </div>
    <!-- 选项（画面中上部白色横条, 独立于对话块——官方 VN 选项样式） -->
    <div id="bond-choices" class="bond-choices"></div>
    <!-- 右下: 继续提示（点击跳过逐字 / 剧情结束点击收尾） -->
    <div id="bond-continue" class="bond-continue" aria-hidden="true">▾</div>
    <!-- 章节标题面板（开场: 模糊背景 + 白色横条 + 深蓝大字, 如"预先应对"） -->
    <div id="bond-title" class="bond-title hidden" aria-hidden="true">
      <div class="bond-title-bg"></div>
      <div class="bond-title-frame"></div>
      <div class="bond-title-bar"><span id="bond-title-text" class="bond-title-text"></span></div>
    </div>
    <!-- 菜单面板（右上"菜单": 对话记录 / 打字速度 / 自动播放 / 结束剧情） -->
    <div id="bond-menu" class="bond-menu hidden" aria-hidden="true">
      <div class="bond-menu-panel">
        <div class="bond-menu-title">菜单</div>
        <div id="bond-menu-main" class="bond-menu-main">
          <button class="bond-menu-item" data-act="history">对话记录</button>
          <button class="bond-menu-item" data-act="speed">打字速度：中</button>
          <button class="bond-menu-item" data-act="auto">自动播放：关</button>
          <button class="bond-menu-item bond-menu-danger" data-act="end">结束剧情</button>
          <button class="bond-menu-item bond-menu-close" data-act="close">关闭</button>
        </div>
        <div id="bond-menu-history" class="bond-menu-history hidden">
          <div class="bond-menu-subtitle">对话记录</div>
          <div id="bond-history-list" class="bond-history-list"></div>
          <button class="bond-menu-item bond-menu-close" data-act="back">返回</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="/static/js/gui.js"></script>
<script src="/static/js/main.js"></script>
<script src="/static/js/settings.js"></script>
<script src="/static/js/mmt.js"></script>
<script type="module" src="/static/js/bond.js"></script>
</body>
</html>
